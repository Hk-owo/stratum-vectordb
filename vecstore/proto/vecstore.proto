// vecstore.proto — internal gRPC contract between the Go side (ChunkStore /
// IndexManager) and the C++ vecstore process. Address configured via
// vecstore.grpc_addr in the node config file.
//
// See Stratum_接口设计v9.md "vecstore 内部 gRPC（vecstore.proto）" for the
// authoritative specification this file mirrors exactly.
syntax = "proto3";
package vecstore;

option go_package = "stratum/api/proto/vecstore";

service ChunkStorageService {
  rpc Write(WriteChunkRequest) returns (WriteChunkResponse);
  rpc Read(ReadChunkRequest) returns (ReadChunkResponse);
  rpc Exists(ExistsChunkRequest) returns (ExistsChunkResponse);
  rpc Delete(DeleteChunkRequest) returns (DeleteChunkResponse);
  rpc DeleteByPrefix(DeleteByPrefixRequest) returns (DeleteByPrefixResponse);
  rpc DiskUsage(DiskUsageRequest) returns (DiskUsageResponse);
}

service VectorIndexService {
  rpc Build(BuildIndexRequest) returns (BuildIndexResponse);
  // AddChunks appends chunk vectors to an index already opened (or created
  // on first call) for (kb_id, version_id). The Go side splits a large
  // build into one Build call followed by one or more AddChunks calls so a
  // single gRPC message never exceeds the default 4 MiB limit.
  rpc AddChunks(AddChunksRequest) returns (AddChunksResponse);
  rpc Search(SearchIndexRequest) returns (SearchIndexResponse);
  rpc Save(SaveIndexRequest) returns (SaveIndexResponse);
  rpc Load(LoadIndexRequest) returns (LoadIndexResponse);
  // ExistsIndex reports whether a persisted index exists at path for
  // (kb_id, version_id): both the Faiss index file and its .ids sidecar
  // must be present for Load to succeed. Stateless — it inspects the
  // filesystem only, so it also answers correctly after this process
  // restarted (the in-memory indexes_ map is empty then). Used by the
  // startup reconcile to derive a version's READY status from disk facts
  // instead of trusting that a build-completion callback was delivered.
  rpc ExistsIndex(ExistsIndexRequest) returns (ExistsIndexResponse);
  rpc Reset(ResetIndexRequest) returns (ResetIndexResponse);
}

message WriteChunkRequest {
  string key = 1;            // knowledge_base_id + chunk_id
  repeated float vector = 2;
}
message WriteChunkResponse {}

message ReadChunkRequest { string key = 1; }
message ReadChunkResponse { repeated float vector = 1; }

message ExistsChunkRequest { string key = 1; }
message ExistsChunkResponse { bool exists = 1; }

message DeleteChunkRequest { string key = 1; }
message DeleteChunkResponse {}

message DeleteByPrefixRequest { string prefix = 1; }
message DeleteByPrefixResponse {}

message DiskUsageRequest {}
message DiskUsageResponse { uint64 bytes = 1; }

message ChunkVectorProto {
  string chunk_id = 1;
  repeated float vector = 2;
}

enum MetricTypeProto {
  COSINE = 0;
  EUCLIDEAN = 1;
  INNER_PRODUCT = 2;
}

// QuantizerTypeProto selects how the in-memory index stores vector
// payloads (Stratum_设计文档v12.md 2.4). QUANTIZER_OFF keeps the
// full-precision IndexHNSWFlat behavior (single-stage exact search); the
// other types build quantized HNSW indexes (IndexHNSWSQ / IndexHNSWPQ)
// whose search results are coarse candidates re-ranked against
// full-precision vectors read from the chunk store.
enum QuantizerTypeProto {
  QUANTIZER_OFF = 0;
  QUANTIZER_SQ8 = 1;      // 8-bit scalar quantization
  QUANTIZER_SQ_BF16 = 2;  // bfloat16 scalar quantization
  QUANTIZER_SQ_FP16 = 3;  // fp16 scalar quantization
  QUANTIZER_PQ = 4;       // product quantization
}

message BuildIndexRequest {
  string kb_id = 1;
  int64 version_id = 2;
  repeated ChunkVectorProto chunks = 3;
  MetricTypeProto metric = 4;
  // Quantizer selection. KB-level and immutable after knowledge-base
  // creation; per-version indexes each carry their own trained quantizer.
  QuantizerTypeProto quantizer = 5;  // default QUANTIZER_OFF
  int32 pq_m = 6;                    // PQ sub-vectors; must divide dim; PQ only
  int32 pq_nbits = 7;                // PQ bits per sub-quantizer; 0 = default 8
}
message BuildIndexResponse {
  // Estimated in-memory footprint of the (kb_id, version_id) index after
  // this build, in bytes, on the "coarse retriever" accounting basis
  // (HNSW graph edges + quantized codes for quantized indexes; vector
  // payload bytes otherwise). 0 = unknown/unreported (callers fall back
  // to their own estimate). See Stratum_设计文档v12.md 3.3.
  int64 mem_bytes = 1;
}

message AddChunksRequest {
  string kb_id = 1;
  int64 version_id = 2;
  repeated ChunkVectorProto chunks = 3;
}
message AddChunksResponse {
  // Cumulative estimated in-memory footprint of the index after this
  // append (same basis as BuildIndexResponse.mem_bytes). 0 = unknown.
  int64 mem_bytes = 1;
}

message SearchIndexRequest {
  string kb_id = 1;
  int64 version_id = 2;
  repeated float vector = 3;
  int32 top_k = 4;
  // Coarse-pass candidate count for the two-stage search; 0 = server
  // default (clamp(top_k * multiplier)). Ignored for full-precision
  // (unquantized) indexes, which resolve exactly in memory.
  int32 candidate_n = 5;
}
message SearchResultProto {
  string chunk_id = 1;
  float score = 2;
}
message SearchIndexResponse { repeated SearchResultProto results = 1; }

message SaveIndexRequest { string kb_id = 1; int64 version_id = 2; string path = 3; }
message SaveIndexResponse {}

message LoadIndexRequest { string kb_id = 1; int64 version_id = 2; string path = 3; }
message LoadIndexResponse {}

message ExistsIndexRequest { string kb_id = 1; int64 version_id = 2; string path = 3; }
message ExistsIndexResponse { bool exists = 1; }

message ResetIndexRequest { string kb_id = 1; int64 version_id = 2; }
message ResetIndexResponse {}
