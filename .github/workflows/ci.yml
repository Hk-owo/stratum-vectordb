# Stratum CI — push 到 main 与 pull request 时运行。
#
#   job go                 Go 侧全量检查：gofmt 格式、go vet、go build、
#                          单元测试（23 个包）、raft/kvraft/index 竞态检测。
#   job docker-integration 三节点 Docker 集群（T4）容错测试，见
#                          README「Testing」与 scripts/docker-cluster.sh。
#
# C++ vecstore 侧（Faiss/RocksDB/gRPC，依赖极重）不在常规 CI 内，
# 由 .github/workflows/vecstore-cpp.yml 手动触发。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go 构建 / 静态检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: 格式检查 (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查 (go vet)
        run: go vet ./...

      - name: 构建
        run: go build ./...

      - name: 单元测试
        run: go test ./... -timeout 180s -count=1

      - name: 竞态检测 (raft / kvraft / index)
        run: go test -race ./internal/kvraft/... ./internal/raft/... ./internal/index/... -timeout 300s -count=1

  docker-integration:
    name: T4 三节点 Docker 集群集成测试
    runs-on: ubuntu-latest
    needs: go
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: 构建镜像 (docker-cluster.sh build)
        run: scripts/docker-cluster.sh build

      - name: 启动 3 节点集群 (--with-embed)
        run: scripts/docker-cluster.sh up 3 --with-embed

      # 排除 TestT4_DataVolume：它需要宿主 :7100 上的 vecstore_server
      # （C++ 构建产物），常规 CI 不构建 C++ 侧；其余两个长时基准
      # （TestT4_PerformanceBaseline / TestT4_StorageEfficiency）内部自行 skip。
      - name: 运行 T4 集群容错测试
        run: go test ./integration/docker/... -tags=docker -v -timeout 300s -skip 'TestT4_DataVolume'

      - name: 清理集群
        if: always()
        run: scripts/docker-cluster.sh down
