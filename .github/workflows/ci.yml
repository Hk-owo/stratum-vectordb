# Stratum CI — push 到 main 与 pull request 时运行。
#
#   job go                 Go 侧全量检查：gofmt 格式、go vet、go build、
#                          单元测试（23 个包）、raft/kvraft/index 竞态检测。
#   job docker-integration 两层 Docker 集群（T4）容错测试，见
#                          README「Testing」与 scripts/cluster.sh（--topology two-tier）。
#
# C++ vecstore 侧（Faiss/RocksDB/gRPC，依赖极重）不在常规 CI 内，
# 由 .github/workflows/vecstore-cpp.yml 手动触发。

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go 构建 / 静态检查 / 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      - name: 格式检查 (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未按 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi

      - name: 静态检查 (go vet)
        run: go vet ./...

      - name: 构建
        run: go build ./...

      # 分两步，因为两类用例的**整包耗时**差一个数量级，而 -timeout 是**每个包**的预算：
      #
      #   - 非 integration：28 个包，最慢的包 8s，整条命令约 40s。180s 是给慢机器的余量，
      #     同时也是"卡住"时的上限——越短越早暴露（ThreeNodeCluster_FaultTolerance 卡 9
      #     分钟那次，就是整包超时把其余用例的结果一起吞掉）。
      #   - integration：实测 60–120s，并且包含真实集群的收敛等待（TestRealStack_* 里有
      #     20–125s 的守门等待）。塞在 180s 里只剩几十秒余量，一次慢轮就整包超时。
      #
      # 覆盖率仍合成一份 coverage.out 交给 Codecov。实测：非 integration 的 profile 已经
      # 覆盖了全部源文件（12368 行），integration 那份是 `[no statements]`（该包没有非测试
      # 源文件）—— 所以拆分对 Codecov 的口径没有影响（合并后 go tool cover 得 56.4%，
      # 与拆分前一次跑完全相同）。integration 仍带 -coverprofile，是为了将来 integration
      # 包真的有了源文件时不必再改这里。
      - name: 单元测试(含覆盖率)
        run: |
          go test $(go list ./... | grep -v '/integration') \
            -timeout 180s -count=1 -covermode=atomic -coverprofile=coverage-unit.out

      - name: 集成测试(真实栈，含覆盖率)
        run: |
          go test ./integration/ \
            -timeout 600s -count=1 -covermode=atomic -coverprofile=coverage-integration.out

      - name: 合并覆盖率
        # always(): 集成测试红了也要把单元测试的覆盖率交上去，否则 Codecov 看到的
        # 是"这次提交没测过"，而不是"集成测试失败"。集成测试红 = 这一步红，覆盖率照传。
        if: always()
        run: |
          if [ -f coverage-unit.out ]; then
            head -1 coverage-unit.out > coverage.out
            tail -n +2 coverage-unit.out >> coverage.out
            if [ -f coverage-integration.out ]; then
              tail -n +2 coverage-integration.out >> coverage.out
            fi
          else
            echo "没有 coverage-unit.out —— 单元测试那一步没产出覆盖率" >&2
            exit 1
          fi

      # 覆盖率同时写进 job summary(免登录可读)与 Codecov(徽章 + 逐行视图)。
      # 上传失败不判 CI 红:未配 CODECOV_TOKEN 时会退化成 tokenless 上传,
      # 公共仓库可用,但也不该因此拖垮构建。
      - name: 覆盖率摘要
        run: |
          go tool cover -func=coverage.out | tail -1
          {
            echo '## Go 单元测试覆盖率'
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率到 Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unit
          fail_ci_if_error: false

      - name: 竞态检测 (raft / kvraft / index)
        run: go test -race ./internal/kvraft/... ./internal/raft/... ./internal/index/... -timeout 300s -count=1

  docker-integration:
    name: T4 两层 Docker 集群集成测试
    runs-on: ubuntu-latest
    needs: go
    # C++ 侧（Faiss 源码构建）本身十几分钟，加镜像与整套用例（实测 685s）。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true

      # --- C++ 侧：照搬 vecstore-cpp.yml 的依赖清单与构建顺序 ---
      # 这一步不能省：T4 的存储半边镜像与宿主 vecstore 都来自
      # run/bin/vecstore_server，而 run/ 不在版本库里（.gitignore 忽略它）。
      # 少了 C++，集群会起来、但没有任何版本能变成 READY，需要 READY 的用例全红。
      - name: 安装 C++ 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake \
            libprotobuf-dev protobuf-compiler protobuf-compiler-grpc \
            libgrpc++-dev librocksdb-dev \
            libblas-dev liblapack-dev libgtest-dev prometheus-cpp-dev

      - name: 构建 Faiss (v1.9.0, HNSW, 静态)
        run: |
          git clone --depth 1 --branch v1.9.0 \
            https://github.com/facebookresearch/faiss.git "$HOME/faiss"
          cmake -B "$HOME/faiss/build" -S "$HOME/faiss" \
            -DFAISS_ENABLE_GPU=OFF -DFAISS_ENABLE_PYTHON=OFF \
            -DFAISS_ENABLE_C_API=OFF -DBUILD_TESTING=OFF \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build "$HOME/faiss/build" -j"$(nproc)"

      - name: 构建 vecstore_server
        run: |
          # 这两个路径必须显式传：vecstore/CMakeLists.txt 的默认值假设 Faiss 是
          # **仓库的兄弟目录**（${CMAKE_CURRENT_SOURCE_DIR}/../../faiss），而上面把
          # 它 clone 到了 $HOME/faiss。runner 的 checkout 在
          # /home/runner/work/<repo>/<repo> 下，兄弟目录是 /home/runner/work/stratum/faiss
          # ——与 $HOME/faiss 不是同一个位置，且 find_path/find_library 都用
          # NO_DEFAULT_PATH，不传就会 FATAL_ERROR "Faiss not found"。
          # vecstore-cpp.yml 一直传着这两个参数，这个 job 加的时候漏了。
          cmake -S . -B run/cmake \
            -DFAISS_SOURCE_DIR="$HOME/faiss" \
            -DFAISS_BUILD_DIR="$HOME/faiss/build"
          cmake --build run/cmake --target vecstore_server -j"$(nproc)"
          mkdir -p run/bin
          cp run/cmake/vecstore/vecstore_server run/bin/vecstore_server

      # --- 两层拓扑（控制组 3 + 存储组 3）---
      # 用两层而不是 single：后者的宿主 vecstore 目前会在 Save 时抛异常
      # （节点日志 "index: Save RPC: ... Unexpected error in RPC handling"），
      # 于是没有版本能到 READY。两层下每个容器自带 vecstore，同一套用例实测全绿。
      #
      # 两种拓扑现在是同一个脚本（scripts/cluster.sh），用 --topology 区分。
      - name: 构建镜像 (cluster.sh --topology two-tier build)
        run: scripts/cluster.sh --topology two-tier build

      - name: 启动两层集群
        run: scripts/cluster.sh --topology two-tier up

      # 排除 TestT4_DataVolume：它要宿主 :7100 上单独一个 vecstore；这台机器在
      # CI 里只为镜像与宿主进程构建 C++，不额外起那一个。其余两个长时基准
      # （TestT4_PerformanceBaseline / TestT4_StorageEfficiency）内部自行 skip。
      # timeout 900s：整套实测 685s，其中含一条故意停掉 embedder、等过
      # dataMissingMinAgeSec（120s）再断言 data_missing 的用例。
      # 直连节点的用例（await_direct / stale_replica / controlLeaderIndex）要自己签
      # 服务站的信任标记，而它是 HMAC，密钥由 cluster.sh 生成在
      # run/docker-both/station-secret。测试自己也会去找那个文件（以及单层的
      # run/docker/station-secret），这里导出一次是双保险：run 目录布局再变时，用例
      # 不至于退化成"节点拒绝一切调用"。
      - name: 导出服务站信任标记密钥
        run: |
          secret_file=run/docker-both/station-secret
          if [[ -f "$secret_file" ]]; then
            echo "STRATUM_STATION_SECRET=$(cat "$secret_file")" >> "$GITHUB_ENV"
          else
            echo "没有 $secret_file —— 集群没起或没生成凭据，直连节点的用例会以 unauthenticated 失败" >&2
          fi

      - name: 运行 T4 集群容错测试
        env:
          STRATUM_T4_NODE_SERVICES: stratum-node-control1,stratum-node-control2,stratum-node-control3
        run: go test ./integration/docker/... -tags=docker -v -timeout 900s -skip 'TestT4_DataVolume'

      - name: 清理集群
        if: always()
        run: scripts/cluster.sh --topology two-tier down
