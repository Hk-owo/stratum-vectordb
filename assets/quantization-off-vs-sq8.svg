<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="量化两段式买到的是内存，不是延迟">
  <title>量化两段式买到的是内存，不是延迟</title>
  <desc>折线图：全精度 OFF（实线）与 SQ8（虚线）的 p50 / p95 / p99 查询延迟（ms，对数纵轴）对比。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .axis-t { font-size: 11.5px; fill: #6b7280; }
      .tick   { font-size: 11px; fill: #6b7280; }
      .pt     { font-size: 11px; font-weight: 600; }
      .legend { font-size: 12px; fill: #374151; }
      .note   { font-size: 10.5px; fill: #6b7280; }
      .grid   { stroke: #e5e7eb; stroke-width: 1; }
      .axline { stroke: #9ca3af; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">量化两段式买到的是内存，不是延迟</text>
  <text x="450.0" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">同一个用例、同一台机器，只把知识库创建时的量化类型换成 SQ8（创建后不可变）</text>

