  <text x="450.0" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">TestT4_QueryLatency · 三档全部每档 clean 后单跑 · 两层 3+5（每库 3 副本，768 维）· HTTP/2 长连接 · 2026-11-22</text>
