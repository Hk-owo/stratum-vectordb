<text class="note" x="86" y="524">三档下 SQ8 与 OFF 延迟差均在轮间波动内（2k +1.74 ms / 8k −0.70 ms / 20k +2.57 ms）：量化买到的是 1/4 向量内存，而非更低延迟。</text>
