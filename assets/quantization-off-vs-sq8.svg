<rect x="110" y="62" width="14" height="14" fill="#2563eb" rx="2"/>
<text class="legend" x="130" y="73">OFF（全精度，4 B/维）</text>
<rect x="340" y="62" width="14" height="14" fill="#0d9488" rx="2"/>
<text class="legend" x="360" y="73">SQ8（1 B/维 + 全精度 rerank）</text>
<text class="note" x="86" y="524">三档下热 p50 几乎持平（2k +0.05 ms / 8k +0.06 ms / 20k −0.01 ms），8k/20k 尾部因 rerank 磁盘读略高：量化买到的是 1/4 向量内存，而非更低延迟。</text>
