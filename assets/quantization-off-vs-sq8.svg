<rect x="436" y="361.9" width="30" height="94.1" fill="#0d9488" rx="2"/>
<text class="pt" x="451.0" y="355.9" text-anchor="middle" fill="#0d9488">5.23</text>
<text class="tick" x="434" y="474" text-anchor="middle">p99</text>
<text class="legend" x="666.5" y="498" text-anchor="middle" font-weight="600">8,000 篇</text>
<rect x="543" y="280.0" width="30" height="176.0" fill="#2563eb" rx="2"/>
<text class="pt" x="558.0" y="274.0" text-anchor="middle" fill="#2563eb">9.78</text>
<rect x="577" y="243.2" width="30" height="212.8" fill="#0d9488" rx="2"/>
<text class="pt" x="592.0" y="237.2" text-anchor="middle" fill="#0d9488">11.82</text>
<text class="tick" x="575" y="474" text-anchor="middle">p50</text>
<rect x="666" y="217.1" width="30" height="238.9" fill="#2563eb" rx="2"/>
<text class="pt" x="681.0" y="211.1" text-anchor="middle" fill="#2563eb">13.27</text>
<rect x="700" y="180.2" width="30" height="275.8" fill="#0d9488" rx="2"/>
<text class="pt" x="715.0" y="174.2" text-anchor="middle" fill="#0d9488">15.32</text>
<text class="tick" x="698" y="474" text-anchor="middle">p95</text>
<rect x="789" y="138.8" width="30" height="317.2" fill="#2563eb" rx="2"/>
<text class="pt" x="804.0" y="132.8" text-anchor="middle" fill="#2563eb">17.62</text>
<rect x="823" y="139.4" width="30" height="316.6" fill="#0d9488" rx="2"/>
<text class="pt" x="838.0" y="133.4" text-anchor="middle" fill="#0d9488">17.59</text>
<text class="tick" x="821" y="474" text-anchor="middle">p99</text>
<line class="axline" x1="473" y1="456" x2="473" y2="504" stroke-dasharray="3 3"/>
<rect x="110" y="66" width="14" height="14" fill="#2563eb" rx="2"/>
<text class="legend" x="130" y="77">OFF（全精度，4 B/维）</text>
<rect x="340" y="66" width="14" height="14" fill="#0d9488" rx="2"/>
<text class="legend" x="360" y="77">SQ8（1 B/维 + 全精度 rerank）</text>
<text class="note" x="86" y="522">两档的差值方向相反、幅度都小于轮间波动：在该规模下 SQ8 把向量内存载荷降到 1/4，延迟无可测差异。</text>
<text class="note" x="86" y="536">20,000 篇档未跑 SQ8。</text>
</svg>
