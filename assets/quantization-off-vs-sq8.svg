<text class="legend" x="132" y="190">p50 SQ8</text>
<text class="note" x="86" y="514">三个规模上的差都落在轮间噪声里；能确定的是「量化不给这条路径带来延迟收益」——粗筛省下的时间被 rerank 吃掉了。</text>
<text class="note" x="86" y="526">量化买到的：单版本索引产物 1,000 篇时 OFF 33,792 B → SQ8 11,440 B（34%），以及 1 B/维的内存载荷。</text>
<text class="note" x="86" y="537.5">数据：README「性能实测」2026-09-22 轮实测。20,000 篇 SQ8 的冷查询 277.72 ms 是一次异常样本，未入图。</text>
</svg>
