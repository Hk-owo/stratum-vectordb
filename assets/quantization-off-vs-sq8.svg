<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="全精度 OFF 与 SQ8 量化的查询延迟对照">
  <title>全精度 OFF 与 SQ8 量化的查询延迟对照</title>
  <desc>分组柱状图：2000 / 8000 篇文档下 p50 / p95 / p99 延迟（ms），OFF 与 SQ8 对比。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .axis-t { font-size: 11.5px; fill: #6b7280; }
      .tick   { font-size: 11px; fill: #6b7280; }
      .pt     { font-size: 11px; font-weight: 600; }
      .legend { font-size: 12px; fill: #374151; }
      .note   { font-size: 10.5px; fill: #6b7280; }
      .grid   { stroke: #e5e7eb; stroke-width: 1; }
      .axline { stroke: #9ca3af; stroke-width: 1.2; }
    </style>
  </defs>
  <rect x="0" y="0" width="900" height="540" fill="#ffffff"/>
  <text x="450.0" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">全精度 OFF 与 SQ8 量化的查询延迟对照</text>
  <text x="450" y="48" text-anchor="middle" font-size="11.5" fill="#6b7280">TestT4_QueryLatency · 同一用例、同一集群，只换知识库创建时的量化类型 · 两层拓扑（控制组 3 + 存储组 3，768 维）· 经服务站测量 · 2026-10-16 · 默认配置</text>
<line class="grid" x1="86" y1="456.0" x2="860" y2="456.0"/>
<text class="tick" x="76" y="460.0" text-anchor="end">0 ms</text>
<line class="grid" x1="86" y1="366.0" x2="860" y2="366.0"/>
<text class="tick" x="76" y="370.0" text-anchor="end">5 ms</text>
<line class="grid" x1="86" y1="276.0" x2="860" y2="276.0"/>
<text class="tick" x="76" y="280.0" text-anchor="end">10 ms</text>
<line class="grid" x1="86" y1="186.0" x2="860" y2="186.0"/>
<text class="tick" x="76" y="190.0" text-anchor="end">15 ms</text>
<line class="grid" x1="86" y1="96.0" x2="860" y2="96.0"/>
<text class="tick" x="76" y="100.0" text-anchor="end">20 ms</text>
<line class="axline" x1="86" y1="90" x2="86" y2="456"/>
<line class="axline" x1="86" y1="456" x2="860" y2="456"/>
<text class="axis-t" x="76" y="82" text-anchor="end">延迟</text>
<text class="legend" x="279.5" y="498" text-anchor="middle" font-weight="600">2,000 篇</text>
<rect x="156" y="388.0" width="30" height="68.0" fill="#2563eb" rx="2"/>
<text class="pt" x="171.0" y="382.0" text-anchor="middle" fill="#2563eb">3.78</text>
<rect x="190" y="392.1" width="30" height="63.9" fill="#0d9488" rx="2"/>
<text class="pt" x="205.0" y="386.1" text-anchor="middle" fill="#0d9488">3.55</text>
<text class="tick" x="188" y="474" text-anchor="middle">p50</text>
<rect x="279" y="358.6" width="30" height="97.4" fill="#2563eb" rx="2"/>
