// sync.proto — internal DataSyncService: leader-to-follower data
// replication for the four PebbleDB/Vecstore layers that are NOT
// replicated via Raft.
//
// See Stratum_设计文档v10.md "多副本构建" and "索引异步构建".
//
// Synchronised layers:
//   - DocStore         (kbID + docID + versionID → content)
//   - ChunkDocMapper   (forward + reverse)
//   - VersionDocList   (kbID + versionID + docID)
//   - ChunkStore       (kbID + chunkID → vector)
//
// NOT synchronised (each replica builds independently):
//   - HNSW index           (via IndexManager.TriggerBuild)
//   - Chunk bloom filter   (from local chunk store)
//   - Version bloom filter (from local version doc list)
syntax = "proto3";
package stratum;

option go_package = "stratum/api/proto/stratum";

import "knowledgebase.proto";

// DataSyncService is an internal-only gRPC service for inter-node data
// replication. A node either pulls a version's records (server-side
// streaming) or is handed them by the version's write coordinator
// (client-side streaming) — the push direction is what lets a freshly
// written version reach its target replicas without waiting for them to
// notice it (Stratum_设计文档v13.md §7.2).
service DataSyncService {
  // ExecuteVersionWrite asks THIS node to run the storage-layer write
  // transaction for a version the control layer has already committed
  // (§7.13.2). The leader picks the coordinator from the knowledge base's
  // replica topology and dispatches the work here, so the data-plane cost
  // (split/embed/store locally, then fan out) lands on the coordinator rather
  // than on the control leader. Idempotent per (kb, version).
  rpc ExecuteVersionWrite(ExecuteVersionWriteRequest) returns (ExecuteVersionWriteResponse);

  rpc PullVersionData(PullVersionDataRequest) returns (stream SyncEntry);

  // PullVersionChanges streams the recorded CHANGES for a range of versions, so a
  // node that is behind can replay the delta instead of pulling each version's
  // full record set (§7.5). The writer's WAL already holds them — the same BEGIN
  // record crash recovery replays — so this reads one store for a second purpose.
  //
  // Gaps are visible, not silent: a version with no record is simply not sent, and
  // the caller must fall back to a full state transfer rather than apply the range
  // as if those versions changed nothing.
  rpc PullVersionChanges(PullVersionChangesRequest) returns (stream VersionChanges);

  // Heartbeat is a storage node's periodic "I am alive" to the control leader. The leader
  // keeps when each node last spoke, in memory, and judges storage redundancy from that.
  // It stays the same size however many knowledge bases exist, which is why it carries no
  // cursors: whoever needs a node's cursor asks that node (LocalVersion).
  //
  // accepted=false tells the reporter it reached a non-leader: it re-resolves the leader
  // and tries again next interval (§7.13.1's pattern), rather than the system growing a
  // second forwarding path.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // GetChainTails returns the tail of every knowledge base's version chain. A node calls
  // it when a heartbeat's chain_generation differs from the one it last pulled at, so the
  // heartbeat itself stays the same size however many knowledge bases there are.
  rpc GetChainTails(GetChainTailsRequest) returns (GetChainTailsResponse);

  // PushVersionData hands one version's records to this node: the caller
  // (the write's coordinator) streams the same SyncEntry records
  // PullVersionData would have produced, and receives a single
  // acknowledgement once they have all been applied. Idempotent, like the
  // pull direction: records are keyed by (kb, version, doc/chunk).
  rpc PushVersionData(stream SyncEntry) returns (PushVersionDataResponse);

  // VersionPresence answers whether this node holds (kbID, versionID)'s data.
  // The control layer asks every candidate replica so it can tell a version
  // that is merely unbuilt from one whose data never landed anywhere
  // (Stratum_设计文档v13.md §7.12 step ① — the block-report union).
  rpc VersionPresence(VersionPresenceRequest) returns (VersionPresenceResponse);

  // LocalVersion reports this node's contiguous data cursor for a knowledge
  // base: the highest version whose history it holds completely. A node that
  // is behind uses it to find a peer able to fill its gap instead of always
  // asking the leader (Stratum_设计文档v13.md §7.6).
  rpc LocalVersion(LocalVersionRequest) returns (LocalVersionResponse);

  // DeleteVersionData reclaims a version's physical data on the receiving
  // node. The control layer broadcasts it to *every* candidate replica when it
  // declares a version FAILED_PERMANENT, because it does not know which
  // replicas actually landed the data (Stratum_设计文档v13.md §10.6).
  rpc DeleteVersionData(DeleteVersionDataRequest) returns (DeleteVersionDataResponse);

  // ConfirmVersionWrite tells a replica that the version it received did reach
  // quorum, so the §7.3 takeover timer it started can stand down.
  rpc ConfirmVersionWrite(ConfirmVersionWriteRequest) returns (ConfirmVersionWriteResponse);

  // FetchIndexData streams one version's built index FROM a peer that already
  // holds it — this is §8.4's "分发 N 份" in its only direction.
  //
  // It IS the distribution path, not a complement to one. The push direction
  // (PushIndexData) used to exist beside it and was removed: a push is
  // fire-and-forget, so nothing on the receiving side ever learned that an
  // artifact was meant for it and never arrived, while a replica that is not
  // the owner head (docs/index-owner-sharding-plan.md §5.2) does not build for
  // itself. Asking for it turns that permanent gap into one round trip, and it
  // leaves exactly one闸门 to reason about instead of two half-gates.
  rpc FetchIndexData(FetchIndexDataRequest) returns (stream IndexChunk);
}

// FetchIndexDataRequest names the artifact to fetch. It carries no hint about
// WHO might hold it: the caller asks the peers it knows about and takes the first
// that answers.
message FetchIndexDataRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}

// IndexChunk is one slice of an artifact on the wire. The framing is sidecar
// first, then the index, in 1 MiB slices, terminated by a chunk with last set.
message IndexChunk {
  string knowledge_base_id = 1;
  int64 version_id = 2;
  // sidecar marks the .ids companion, which carries the checksum the index
  // file is validated against. It is streamed first so an install never ends
  // up with an index whose authenticating metadata is missing.
  bool sidecar = 3;
  bytes data = 4;
  // last marks the final chunk of the whole transfer (both files).
  bool last = 5;
}

message ConfirmVersionWriteRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
  // source_addr names where the writer's copy of this version's data lives —
  // its DataSyncService address. The confirmation doubles as the §8.5
  // announcement that turns "who holds this version" into a known fact on the
  // receiving node, instead of something a puller has to discover by probing
  // (probing on the Raft apply path is what made the first attempt at §8.5
  // unusable: `integration` went from 26s to 462s and timed out). Empty when
  // the sender does not announce itself; receivers then simply learn nothing.
  string source_addr = 3;
  // Field 4 was `bool empty_version`, removed together with the ban on
  // change-less versions (docs/cursor-persistence-plan.md §5). The flag told a
  // replica "this version has no documents, move your cursor over it without
  // fetching" — but a version's document set is INHERITED from its parent, so
  // "no changes" only coincides with "no documents" at the root of a chain. A
  // version that removes every document still has an empty set and is still
  // never fanned out; it is now recognised by its (empty) digest, which the
  // writer does report, instead of by a flag on the confirmation.
  //
  // The number is reserved rather than reused: an older peer may still send it,
  // and reusing the tag for a different meaning is exactly how a mixed-version
  // cluster corrupts data quietly.
  reserved 4;
}

message ConfirmVersionWriteResponse {
  int64 node_id = 1;
}

message DeleteVersionDataRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
  // reason is advisory: it is logged, and the cleanup happens regardless.
  string reason = 3;
}

message DeleteVersionDataResponse {
  // dropped reports that the reclaim RAN here. It does not mean "this node held
  // data for the version": the reclaim is an idempotent prefix delete, so a node
  // that held nothing answers true as well. A node that cannot run it at all
  // fails the call instead of answering false — reporting success there would let
  // the control layer remove the version's metadata while the bytes stay behind,
  // and once that row is gone nothing can name them again
  // (docs/known-gaps.md §B/§C).
  bool dropped = 1;
  int64 node_id = 2;
}

message LocalVersionRequest {
  string knowledge_base_id = 1;
}

message LocalVersionResponse {
  int64 version = 1;
  int64 node_id = 2;
}

message VersionPresenceRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}

message VersionPresenceResponse {
  bool present = 1;
  // node_id identifies the replica that answered, so the control layer can
  // log which candidates were missing the version.
  int64 node_id = 2;
}

message PushVersionDataResponse {
  // Echoed so the coordinator can match the ack to the replica it pushed to.
  string knowledge_base_id = 1;
  int64 version_id = 2;
  // acceptor_id is the Raft node ID of the replica that applied the stream;
  // the coordinator counts distinct acceptors against the quorum threshold.
  int64 acceptor_id = 3;
}

message PullVersionDataRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}

// SyncEntry is one record in the stream. The entry_type field determines
// which storage layer the record belongs to.
message SyncEntry {
  SyncEntryType entry_type = 1;
  string kb_id = 2;
  string doc_id = 3;
  string chunk_id = 4;
  int64 version_id = 5;
  bytes payload = 6; // DOC_STORE: docstore tag byte (0x01=content, 0x00=tombstone) + doc text; CHUNK_VECTOR: float32 vector bytes
}

// ExecuteVersionWriteRequest carries what the chosen coordinator needs to run
// the write locally: the version the control layer committed, and the changes
// to apply. The changes travel here rather than inside the Raft log — they
// deliberately stay out of it (§7.7) — so the dispatcher hands them over.
message ExecuteVersionWriteRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
  int64 parent_version_id = 3;
  repeated DocChange changes = 4;
  // client_request_id is the originating write's idempotency key, forwarded so
  // a retried dispatch and a client retry describe the same transaction
  // (§7.12).
  string client_request_id = 5;
}

message ExecuteVersionWriteResponse {
  int64 node_id = 1;
  // completed means the local write transaction reached COMMIT: the data is in
  // this node's stores and the version's digest has been reported upward.
  bool completed = 2;
}

message PullVersionChangesRequest {
  string knowledge_base_id = 1;
  // The range is (from_exclusive, to_inclusive] — the versions a lagging node is
  // missing, in the same half-open shape its cursor arithmetic uses (§7.5).
  int64 from_exclusive = 2;
  int64 to_inclusive = 3;
}

// VersionChanges is one version's recorded delta: what its writer changed, so a
// peer can replay it to reach the same state without transferring that version's
// full record set.
message VersionChanges {
  int64 version_id = 1;
  int64 parent_version_id = 2;
  repeated DocChange changes = 3;
}

message HeartbeatRequest {
  reserved 2, 3;
  reserved "data_versions", "address";
  int64 node_id = 1;
}

message HeartbeatResponse {
  reserved 3, 4, 5;
  reserved "reclaimable", "chain_tails", "holders";
  // accepted is false when the receiving node is not the control leader, so the
  // reporter knows to re-resolve rather than assume the heartbeat landed.
  bool accepted = 1;
  // node_id identifies the responder.
  int64 node_id = 2;
  // chain_generation changes whenever any knowledge base's chain tail may have. A node
  // that last pulled at a different generation calls GetChainTails. Absent means this
  // leader offers no signal.
  ChainGeneration chain_generation = 6;
}

// ChainGeneration names one state of the chain tails. Compare for equality only:
// seq counts tail changes on the node that answers and restarts with it, so the term
// is what keeps two leaders' numbers from being mistaken for one another.
message ChainGeneration {
  uint64 term = 1;
  uint64 seq = 2;
}

message GetChainTailsRequest {}

message GetChainTailsResponse {
  // accepted is false when the receiving node is not the control leader.
  bool accepted = 1;
  // chain_tails is, per knowledge base, the newest version the control layer has
  // accepted. Deliberately the chain tail, NOT the active version: a node is not "behind"
  // merely because it has not switched to the newest version. A knowledge base absent
  // from this map means "unknown", not "nothing to catch up".
  map<string, int64> chain_tails = 2;
  // generation is the generation these tails are at least as new as.
  ChainGeneration generation = 3;
}

enum SyncEntryType {
  SYNC_ENTRY_TYPE_UNSPECIFIED = 0;
  SYNC_ENTRY_TYPE_DOC_STORE = 1;         // kb_id + doc_id + version_id + payload
  SYNC_ENTRY_TYPE_CHUNK_DOC_FORWARD = 2; // kb_id + chunk_id + doc_id
  SYNC_ENTRY_TYPE_CHUNK_DOC_REVERSE = 3; // kb_id + doc_id + chunk_id
  SYNC_ENTRY_TYPE_VERSION_DOC_LIST = 4;  // kb_id + version_id + doc_id
  SYNC_ENTRY_TYPE_CHUNK_VECTOR = 5;      // kb_id + chunk_id + payload (float32 vector)
}
