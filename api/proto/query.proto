// query.proto — external QueryService contract: vector queries against a
// knowledge base version.
//
// See Stratum_接口设计v9.md "QueryService" for the authoritative
// specification.
//
// Reserved (not implemented): BatchQuery, HybridQuery. Per
// Stratum_代码风格v2.md's convention of not creating empty placeholder
// files/stubs for unimplemented future work, these are documented here but
// intentionally have no corresponding RPC or message definitions yet.
syntax = "proto3";
package stratum;

option go_package = "stratum/api/proto/stratum";

// AggregationMethod mirrors internal/types.AggregationMethod.
enum AggregationMethod {
  AGGREGATION_METHOD_MEDIAN = 0; // default
  AGGREGATION_METHOD_MAX = 1;
  AGGREGATION_METHOD_MEAN = 2;
}

message QueryResult {
  string doc_id = 1;
  string content = 2;
  float score = 3;
}

service QueryService {
  rpc Query(QueryRequest) returns (QueryResponse);
}

message QueryRequest {
  string knowledge_base_id = 1;
  optional int64 version_id = 2; // unset means "use the active version"
  repeated float vector = 3;  // query vector, generated by the caller's embed model
  int32 top_k = 4;
  optional float threshold = 5; // optional similarity threshold
  AggregationMethod aggregation = 6; // optional; defaults to MEDIAN

  // min_version is the freshness credential the service station attaches
  // (Stratum_设计文档v13.md §9.3): "the version the caller should be seeing".
  // A replica whose contiguous history has not reached it must refuse the
  // query rather than answer from a state that is complete but stale — the
  // failure mode §9.1 risk 1 describes, where a lagging node returns an
  // old-version answer and the caller cannot tell.
  //
  // Unset (0) means "no credential": the caller came directly, or the station
  // has no route table entry for this knowledge base yet. Serving is then the
  // pre-§9 behaviour, which is what keeps a deployment that has not adopted a
  // station working.
  optional int64 min_version = 7;
}

// NOTE on authentication (Stratum_设计文档v13.md §9.3(5)): the service station
// does not forward the caller's credential, and there is deliberately no
// "authenticated" field here. The internal trust mark travels as gRPC metadata
// (see internal/router/auth.go), because it is transport-level context rather
// than part of what is being asked for: a field would have to be set at every
// request construction site, while metadata is injected once on the way out and
// read once on the way in.
//
// min_version above is different: it is part of the question ("the version the
// caller should be seeing"), so it belongs in the request.
message QueryResponse {
  repeated QueryResult results = 1;
  int64 version_id = 2; // the version actually queried

  // storage_degraded reports that the storage layer is below quorum for this
  // knowledge base: fewer than QuorumSize(replicas) of the replicas that must
  // hold it are still reporting (docs/storage-degradation-signal-plan.md §10.1).
  //
  // It rides a READ response on purpose, and it is a REPORT rather than an error
  // condition: the results above are complete and were served by a replica that
  // does hold the data. Below quorum this design keeps serving reads (§2), and
  // this field is how a caller learns that fact WITHOUT having to attempt a
  // write — otherwise the storage layer's health is discoverable only by a write
  // failing, which leaves a read-only client permanently blind.
  //
  // One bit, deliberately, meaning exactly:
  //   false = "not degraded, or not known";  true = "below quorum".
  // The two false cases are collapsed because the judgement is leader-side soft
  // state that a leadership change empties, so "we cannot tell" must have the
  // same value as the safe direction — a client must never read a failover as a
  // broken cluster. A caller that ignores this field behaves exactly as it did
  // before the field existed; the diagnosis ("1 of 3 required replicas live,
  // silent: 12") is only available from a write refusal or a health check.
  //
  // The station sets it, not the storage node: the verdict lives in the control
  // leader's aggregate, and the station is what holds a refreshed copy of it. A
  // read sent DIRECTLY to a storage node therefore carries false regardless.
  bool storage_degraded = 3;
}
