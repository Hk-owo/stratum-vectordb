// knowledgebase.proto — external KnowledgeBaseService contract: knowledge
// base lifecycle and version management.
//
// See Stratum_接口设计v9.md "KnowledgeBaseService" for the authoritative
// specification.
//
// Reserved (not implemented): GetVersion, DiffVersions, TagVersion. Per
// Stratum_代码风格v2.md's convention of not creating empty placeholder
// files/stubs for unimplemented future work (see IVF/FLAT under vecstore),
// these are documented here but intentionally have no corresponding RPC
// or message definitions yet.
syntax = "proto3";
package stratum;

option go_package = "stratum/api/proto/stratum";

// IndexStatus mirrors internal/types.IndexStatus.
enum IndexStatus {
  INDEX_STATUS_PENDING = 0; // metadata allocated, storage-layer write in progress; not queryable
  INDEX_STATUS_READY = 1;   // index build complete; queryable
  INDEX_STATUS_FAILED = 2;  // build failed; RebuildIndex can re-trigger
  INDEX_STATUS_FAILED_PERMANENT = 3; // retry budget spent or unrecoverable; only an operator can retry or abandon it
}

// DataStatus mirrors internal/types.DataStatus: a version's DATA-side state,
// kept separate from IndexStatus because the two fail apart — a version whose
// data is durable may still have no working index, and an index that never built
// says nothing about whether the data landed (Stratum_设计文档v13.md §10.1b).
enum DataStatus {
  DATA_STATUS_PENDING = 0;          // metadata allocated, storage-layer write in flight
  DATA_STATUS_DURABLE = 1;          // a quorum of replicas confirmed the data durable
  DATA_STATUS_FAILED_PERMANENT = 2; // the data will never arrive; only an operator can retry or abandon it
}

// FailureSide mirrors internal/types.FailureSide: which half of a version a
// failure verdict settles (§10.1b). It is what lets a report say "the data will
// never arrive" without also claiming the index failed.
enum FailureSide {
  FAILURE_SIDE_DATA = 0;  // the default: the data side
  FAILURE_SIDE_INDEX = 1; // the index side
}

// IndexType mirrors KnowledgeBaseMeta.IndexType. Only HNSW has a real
// implementation today; IVF / FLAT are reserved for later iterations.
enum IndexType {
  INDEX_TYPE_HNSW = 0;
  INDEX_TYPE_IVF = 1;
  INDEX_TYPE_FLAT = 2;
}

// Similarity mirrors KnowledgeBaseMeta.Similarity.
enum Similarity {
  SIMILARITY_COSINE = 0;
  SIMILARITY_EUCLIDEAN = 1;
  SIMILARITY_INNER_PRODUCT = 2;
}

// QuantizerType mirrors the vecstore-side QuantizerTypeProto
// (Stratum_设计文档v12.md 2.4): how the in-memory index stores vector
// payloads. QUANTIZER_OFF keeps full-precision HNSW (single-stage exact
// search); the others build quantized coarse retrievers whose results are
// re-ranked against full-precision vectors on disk.
enum QuantizerType {
  QUANTIZER_OFF = 0;
  QUANTIZER_SQ8 = 1;
  QUANTIZER_SQ_BF16 = 2;
  QUANTIZER_SQ_FP16 = 3;
  QUANTIZER_PQ = 4;
}

// KBStatus mirrors internal/types.KBStatus.
enum KBStatus {
  KB_STATUS_ACTIVE = 0;
  KB_STATUS_DELETING = 1;
  KB_STATUS_DELETE_FAILED = 2;
}

// ChangeOp mirrors internal/types.ChangeOp.
enum ChangeOp {
  CHANGE_OP_ADD = 0;
  CHANGE_OP_DELETE = 1;
  CHANGE_OP_UPDATE = 2;
}

message EmbedConfig {
  string service_addr = 1;
  string model_id = 2; // participates in chunk ID computation: SHA-256(chunk text + model_id)
}

message DocChange {
  ChangeOp op = 1;
  string doc_id = 2;
  string content = 3; // required for ADD / UPDATE
}

message VersionInfo {
  int64 version_id = 1;
  int64 parent_version_id = 2;
  int64 created_at = 3; // Unix timestamp, leader's local clock at apply time
  IndexStatus index_status = 4;
  bool deleting = 5; // true while an asynchronous DeleteVersion cleanup is in progress
  // data_status is the same version's DATA-side state (§10.1b). It is reported
  // alongside index_status rather than folded into it: a version can be
  // queryable while its data is still being written, and it can have durable
  // data with no index at all.
  DataStatus data_status = 6;
  // doc_id_set_hash is the version's document-set digest (§7.9): the canonical
  // SHA-256 of the version's sorted document IDs, and the digest of the EMPTY set
  // for a version that has no documents. It travels because the storage layer
  // cannot otherwise tell an empty version from one whose digest was never
  // committed — and that distinction decides whether a node may step its cursor
  // over the version (see wire.VersionFromInfo).
  //
  // An empty string means "no digest has been committed", which is NOT the same as
  // the empty set's digest.
  string doc_id_set_hash = 7;
}

// KnowledgeBaseInfo is the console-facing metadata of a knowledge base,
// returned by ListKnowledgeBases / GetKnowledgeBase.
message KnowledgeBaseInfo {
  string knowledge_base_id = 1;
  string name = 2;
  int32 chunk_window_size = 3;
  int32 chunk_overlap_size = 4;
  IndexType index_type = 5;
  Similarity similarity = 6;
  EmbedConfig embed_config = 7;
  int64 active_version_id = 8;
  KBStatus status = 9;
  QuantizerType quantizer = 10; // immutable after creation; default OFF
  int32 pq_m = 11;              // PQ only; default 96
  int32 pq_nbits = 12;          // PQ only; default 8
}

service KnowledgeBaseService {
  rpc CreateKnowledgeBase(CreateKnowledgeBaseRequest) returns (CreateKnowledgeBaseResponse);
  rpc DeleteKnowledgeBase(DeleteKnowledgeBaseRequest) returns (DeleteKnowledgeBaseResponse);
  rpc CreateVersion(CreateVersionRequest) returns (CreateVersionResponse);
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);
  rpc RollbackVersion(RollbackVersionRequest) returns (RollbackVersionResponse);
  rpc DeleteVersion(DeleteVersionRequest) returns (DeleteVersionResponse);
  rpc ListKnowledgeBases(ListKnowledgeBasesRequest) returns (ListKnowledgeBasesResponse);
  rpc GetKnowledgeBase(GetKnowledgeBaseRequest) returns (GetKnowledgeBaseResponse);

  // GetDataVersionHolders answers "which nodes reported holding kbID at or past
  // versionID" — the §3.1 question the service station's route table asks. It
  // reads the control leader's in-memory §7.13.4 aggregate, which is SOFT state:
  // an empty answer means "no node I have heard from", never "no node has it".
  //
  // It belongs on this control-layer service rather than on DataSyncService
  // because of who asks and who answers: the station already holds a control
  // connection (ListKnowledgeBases is how it learns the target version), while
  // the reporters are the data nodes.
  rpc GetDataVersionHolders(GetDataVersionHoldersRequest) returns (GetDataVersionHoldersResponse);
}

message CreateKnowledgeBaseRequest {
  string name = 1;
  int32 chunk_window_size = 2;
  int32 chunk_overlap_size = 3;
  IndexType index_type = 4;   // optional; defaults to HNSW
  Similarity similarity = 5;  // optional; defaults to COSINE
  EmbedConfig embed_config = 6;
  QuantizerType quantizer = 7;  // optional; defaults to QUANTIZER_OFF
  int32 pq_m = 8;               // PQ only; 0 = default 96
  int32 pq_nbits = 9;           // PQ only; 0 = default 8
}
message CreateKnowledgeBaseResponse {
  string knowledge_base_id = 1;
  int64 initial_version_id = 2;
}

message DeleteKnowledgeBaseRequest {
  string knowledge_base_id = 1;
}
message DeleteKnowledgeBaseResponse {
  bool success = 1; // returned immediately after marking for deletion; cleanup runs asynchronously
}

message CreateVersionRequest {
  string knowledge_base_id = 1;
  int64 parent_version_id = 2;
  repeated DocChange changes = 3;
  // Optional client-generated idempotency key. A retry carrying the same key
  // (for the same knowledge base) reuses the version the first attempt
  // allocated instead of allocating another one — which is what lets a client
  // re-send the changes for a version whose data never landed
  // (Stratum_设计文档v13.md §7.12). Empty keeps the historical behaviour: every
  // call allocates a new version.
  string client_request_id = 4;
}
message CreateVersionResponse {
  int64 version_id = 1; // newly created version; PENDING, index building asynchronously
}

message ListVersionsRequest {
  string knowledge_base_id = 1;
}
message ListVersionsResponse {
  repeated VersionInfo versions = 1;
}

message RollbackVersionRequest {
  string knowledge_base_id = 1;
  int64 target_version_id = 2;
}
message RollbackVersionResponse {
  bool success = 1;
}

// VersionDeleteMode selects which versions DeleteVersion removes relative
// to the target version. It maps to internal/types.VersionDeleteMode.
enum VersionDeleteMode {
  // Remove the target version together with every descendant version
  // (the original DeleteVersion semantics). Default, so clients that do
  // not send a mode keep the historical behavior.
  VERSION_DELETE_MODE_SUBTREE = 0;
  // Remove only the target version itself: its child version (the chain is
  // strictly linear, so there is at most one) is re-parented onto the
  // target's parent — a linked-list splice. This is how an arbitrary
  // "middle" version is removed without dragging its descendants along.
  VERSION_DELETE_MODE_SINGLE = 1;
  // Remove every ancestor (前置版本) of the target version, making the
  // target the new base (root) of the knowledge base. The chain is strictly
  // linear, so this is a prefix removal. The response lists every version
  // actually marked for deletion.
  VERSION_DELETE_MODE_ANCESTORS = 2;
}

message DeleteVersionRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
  // Which versions to remove relative to version_id; defaults to
  // VERSION_DELETE_MODE_SUBTREE when unset.
  VersionDeleteMode mode = 3;
}
message DeleteVersionResponse {
  bool success = 1; // returned immediately after marking the version(s) for deletion; cleanup runs asynchronously
  // Every version this call marked for deletion, in unspecified order.
  // Empty when the request was a no-op (e.g. ANCESTORS on a version that is
  // already the base).
  repeated int64 deleted_version_ids = 2;
}

message ListKnowledgeBasesRequest {}
message ListKnowledgeBasesResponse {
  repeated KnowledgeBaseInfo knowledge_bases = 1;
}

message GetKnowledgeBaseRequest {
  string knowledge_base_id = 1;
}
message GetKnowledgeBaseResponse {
  KnowledgeBaseInfo knowledge_base = 1;
}

// DataVersionHolder is one node the leader's aggregate believes holds a version.
message DataVersionHolder {
  int64 node_id = 1;

  // address is the node's storage-layer gRPC address, as the node itself
  // reported it. It is carried here so a consumer can act on the answer
  // directly: the station has to forward to an address, and node ids alone would
  // force a second id→address map onto every consumer.
  string address = 2;
}

message GetDataVersionHoldersRequest {
  string knowledge_base_id = 1;

  // version_id is the version that must be servable. A node whose reported
  // cursor reaches it is a holder; a node that has never reported is absent —
  // which is why an empty answer is not "nobody has it".
  int64 version_id = 2;
}

message GetDataVersionHoldersResponse {
  // Ascending by node_id, so a caller's choice is reproducible rather than
  // dependent on map iteration order.
  repeated DataVersionHolder holders = 1;

  // known is false when the answering node is not the control leader: its
  // aggregate is empty only because it has never folded a report. The caller
  // should re-resolve the leader rather than read the empty list as a fact.
  bool known = 2;
}
