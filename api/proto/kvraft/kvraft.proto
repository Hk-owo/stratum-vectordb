// kvraft.proto — internal gRPC contract for Raft consensus RPCs
// (RequestVote / AppendEntries / InstallSnapshot), used between Stratum
// nodes for the Raft state machine layer (internal/kvraft, internal/raft).
//
// Adapted from the KVServer project's raft.proto (an MIT 6.5840-style
// teaching implementation) as the foundation for Stratum's RaftNode, per
// Stratum_实现顺序.md 阶段 3: "依赖现有 kvserver Raft，扩展状态机支持知识库和
// 版本元数据". Field-for-field identical to the source proto; only the
// package/go_package and comment language changed to match this repo's
// conventions.
syntax = "proto3";

package kvraft;

option go_package = "stratum/api/proto/kvraft";

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// Leader election vote request/response.
message RequestVoteRequest {
  uint64 term           = 1; // candidate's term
  int64  candidate_id   = 2; // candidate's ID
  uint64 last_log_index = 3; // candidate's last log index
  uint64 last_log_term  = 4; // candidate's last log term
}

message RequestVoteResponse {
  uint64 term         = 1; // current term, for the candidate to update itself
  bool   vote_granted = 2; // whether the vote was granted
}

// Log replication / heartbeat.
message AppendEntriesRequest {
  uint64         term           = 1; // leader's term
  int64          leader_id      = 2; // leader's ID
  uint64         prev_log_index = 3; // index of the log entry preceding the new ones
  uint64         prev_log_term  = 4; // term of the log entry preceding the new ones
  repeated Entry entries        = 5; // log entries to append; empty for a heartbeat
  uint64         leader_commit  = 6; // leader's commit index
}

message AppendEntriesResponse {
  uint64 term           = 1;
  bool   success         = 2;
  uint64 conflict_index = 3;
  uint64 conflict_term  = 4;
}

// Snapshot transfer.
message InstallSnapshotRequest {
  uint64 term                = 1; // leader's term
  int64  leader_id           = 2; // leader's ID
  uint64 last_included_index = 3; // last log index covered by the snapshot
  uint64 last_included_term  = 4; // term of the last log index covered by the snapshot
  bytes  data                 = 5; // snapshot data
}

message InstallSnapshotResponse {
  uint64 term = 1; // current term
}

// A single log entry.
message Entry {
  uint64 index = 1; // log index
  uint64 term  = 2; // log term
  bytes  data  = 3; // command payload
}
