// internal.proto — InternalService: node-to-node control-plane traffic that is
// not part of any public API.
//
// Why it exists: Raft only lets the leader append to the log, but the facts a
// node needs to report do not always originate there. A storage replica that
// finished writing a version, or any node running its startup reconcile, has
// something to say regardless of where it landed
// (Stratum_设计文档v13.md §7.3/§7.8).
//
// Propose is the single funnel for that: the caller hands over the encoded
// command, and the receiving node runs it through Raft (it is the leader).
// The payload is metadata only — never document content.
syntax = "proto3";
package stratum;

option go_package = "stratum/api/proto/stratum";

service InternalService {
  // Propose runs one command through Raft on the caller's behalf. The
  // receiving node must be the leader; a node that is not answers with a
  // redirect instead of forwarding again, so a forward never chains.
  rpc Propose(ProposeRequest) returns (ProposeResponse);


  // VersionLiveness answers the two facts a "was this version removed?" judgement needs,
  // from ONE view of the replicated metadata: which versions in a range are still alive,
  // and the highest id ever allocated.
  //
  // It is ONE call rather than two because the two must agree. "id <= last_allocated" is
  // what proves the view has already passed that id's allocation — the counter is
  // monotonic and every view applies in order — and only then does "and it is not alive"
  // mean REMOVED rather than "I have not got there yet". Reading the two separately could
  // combine a newer list with an older bound and call a live version gone.
  //
  // Neither fact has a lifetime, and that is what replaced the removal records this RPC
  // took the place of: a removal record is history that pruning could drop
  // (docs/known-gaps.md §B), while these are properties of the current state — nothing to
  // keep, nothing to prune, and no window in which the evidence can disappear. A storage
  // node has no state machine of its own, so this is how it judges its own leftovers.
  //
  // DeletionsSince below IS a removal record, and the difference is what it is allowed to
  // decide: nothing. It is a bounded accelerator that spares a consumer from re-reading a
  // range when nothing was deleted; every judgement that DELETES DATA still comes from
  // this call, which is why a consumer that falls behind the log loses no correctness,
  // only the saving.
  rpc VersionLiveness(VersionLivenessRequest) returns (VersionLivenessResponse);

  // DeletionsSince is the INCREMENTAL read of the bounded deletion log: entries after
  // after_seq, plus the three facts a consumer needs to interpret them (latest_seq,
  // oldest_seq, epoch).
  //
  // It exists to spare a storage node from re-reading a whole version range when
  // nothing was deleted — not to replace VersionLiveness, which stays the authority.
  // A consumer that cannot be served incrementally (its watermark is older than
  // oldest_seq, or the epoch differs) is expected to fall back to the live-chain read
  // and lose nothing: the log is a removal record, and removal records are history
  // that pruning can drop (see VersionLiveness's note), which is exactly why nothing
  // is allowed to depend on this read alone.
  //
  // Sequence numbers are assigned at apply time and identical on every replica, so a
  // consumer's watermark is comparable across the control tier. The epoch identifies
  // the state machine that minted them: a rebuilt cluster mints a new one, and a
  // consumer that sees a different epoch must void its watermark rather than read the
  // difference as "I am ahead".
  rpc DeletionsSince(DeletionsSinceRequest) returns (DeletionsSinceResponse);
}

message DeletionsSinceRequest {
  // after_seq is the consumer's watermark: only entries with a greater seq come back.
  int64 after_seq = 1;
  // limit caps one page. 0 means the server's own page size.
  int32 limit = 2;
}

message DeletionsSinceResponse {
  repeated DeletedVersionEntry entries = 1;
  // latest_seq is the log's current sequence number (0 when nothing was ever
  // deleted). Equal to the consumer's watermark means "nothing new".
  int64 latest_seq = 2;
  // oldest_seq is the sequence of the oldest RETAINED entry, or 0 when the log is
  // empty. A consumer whose watermark is below it (or equal to 0 while latest_seq is
  // above it, i.e. the log itself is empty but sequence numbers exist) has fallen
  // past the retained window and must re-judge from the live chain.
  int64 oldest_seq = 3;
  // epoch identifies the state machine that minted these sequence numbers.
  string epoch = 4;
}

message DeletedVersionEntry {
  int64 seq = 1;
  string knowledge_base_id = 2;
  // version_id is the removed version. 0 names the knowledge base ITSELF: a whole-KB
  // deletion removes the KB and every version in one apply, so it is one entry (never
  // one per version) and the reclaim is the KB-wide prefix delete.
  int64 version_id = 3;
}

message VersionLivenessRequest {
  string knowledge_base_id = 1;
  // The range the caller cares about — its own local list. Exclusive on the low side like
  // every other version read in this system. ABSENT bounds mean "the whole chain".
  optional int64 from_exclusive = 2;
  optional int64 to_inclusive = 3;
}

message VersionLivenessResponse {
  // alive_version_ids are the versions in the range still in the metadata, ascending.
  repeated int64 alive_version_ids = 1;
  // last_allocated_version is the highest id ever handed out, cluster-wide, or 0 when
  // nothing has been allocated. An id at or below it was allocated; one above it was not.
  int64 last_allocated_version = 2;
}

message ProposeRequest {
  // The Raft command, exactly as encodeCommand produced it.
  bytes command = 1;
}

message ProposeResponse {
  // The outcome of applying the command, in the same shape as applyResult.
  int64 version_id = 1;
  repeated int64 deleted_version_ids = 2;
  // The sentinel's stable wire name (see internal/errors) rather than a
  // message, so errors.Is still works on the caller's side after the forward.
  // Empty means success; when the name is unknown the message stands alone.
  string error_name = 3;
  string error_message = 4;
  // leader_id is set when the receiving node is not the leader, telling the
  // caller who to ask instead of forwarding the proposal onwards.
  int64 leader_id = 5;
}
