// admin.proto — external AdminService contract: health checks, cluster
// status, system diagnostics, and manual index maintenance operations.
//
// GetClusterStatus exists for the routing layer (cmd/stratum-router): it
// lets a router discover the current Raft leader without scanning the
// whole cluster state. External applications should prefer
// GetSystemStatus for diagnostics.
//
// See Stratum_接口设计v9.md "AdminService" for the authoritative
// specification.
//
// Reserved (not implemented): GetMetrics, GetAuditLog. Per
// Stratum_代码风格v2.md's convention of not creating empty placeholder
// files/stubs for unimplemented future work, these are documented here but
// intentionally have no corresponding RPC or message definitions yet.
syntax = "proto3";
package stratum;

option go_package = "stratum/api/proto/stratum";

import "knowledgebase.proto";

// HealthStatus is the three-state health summary returned by HealthCheck.
enum HealthStatus {
  HEALTH_STATUS_HEALTHY = 0;
  HEALTH_STATUS_DEGRADED = 1;
  HEALTH_STATUS_UNHEALTHY = 2;
}

message StuckVersion {
  string kb_id = 1;
  int64 version_id = 2;
  IndexStatus index_status = 3;
  int64 updated_at = 4;
}

// FailedVersion is a version the control layer declared FAILED_PERMANENT
// (Stratum_设计文档v13.md §10.1): its Saga spent the retry budget, nothing retries
// it automatically, and only an operator can retry or abandon it. The cause
// chain is carried along so acting on it needs no further digging.
message FailedVersion {
  string kb_id = 1;
  int64 version_id = 2;
  string reason = 3;       // why the last attempt failed (the storage layer's report)
  int32 failure_count = 4; // failed attempts before the verdict
  // side is WHICH half of the version died (§10.1b). It is not decoration: the
  // two verdicts are independent, their remedies differ (retry the write vs
  // rebuild the index), and without it an operator cannot tell which to reach for.
  FailureSide side = 5;
}

message WALAlert {
  string description = 1; // human-readable summary of the stuck PendingRecord
  int32 retry_count = 2;
}

message ResourceUsage {
  int32 loaded_index_count = 1;
  int64 chunk_store_bytes = 2;
  int64 doc_store_bytes = 3;
}

service AdminService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetSystemStatus(GetSystemStatusRequest) returns (GetSystemStatusResponse);
  rpc GetClusterStatus(GetClusterStatusRequest) returns (GetClusterStatusResponse);
  rpc RebuildIndex(RebuildIndexRequest) returns (RebuildIndexResponse);
  rpc WarmupVersion(WarmupVersionRequest) returns (WarmupVersionResponse);

  // The operator's three verbs for a version the control layer declared
  // FAILED_PERMANENT (Stratum_设计文档v13.md §10.1): see it, retry it, abandon it.
  //
  // They live here rather than on KnowledgeBaseService because the caller is an
  // operator acting on a verdict, not an application working with a version — and
  // because a deployment that never needs them can leave them unused without that
  // showing up in the application's contract.
  rpc ListFailedVersions(ListFailedVersionsRequest) returns (ListFailedVersionsResponse);
  rpc ForceRetryVersion(ForceRetryVersionRequest) returns (ForceRetryVersionResponse);
  rpc ForceAbandonVersion(ForceAbandonVersionRequest) returns (ForceAbandonVersionResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  HealthStatus status = 1;
  string details = 2;
}

message GetSystemStatusRequest {}
message GetSystemStatusResponse {
  HealthCheckResponse health = 1;
  repeated StuckVersion stuck_versions = 2;
  repeated string delete_failed_kbs = 3;
  repeated WALAlert wal_alerts = 4;
  ResourceUsage resource_usage = 5;
  repeated StuckVersion deleting_versions = 6; // versions whose DeleteVersion cleanup is in progress or unfinished
  // data_missing_versions lists PENDING versions whose data no candidate
  // replica holds: they cannot become READY on their own and are only
  // recoverable by the writer re-sending its changes under the same
  // client_request_id (Stratum_设计文档v13.md §7.12).
  repeated StuckVersion data_missing_versions = 7;
  // failed_permanent_versions lists versions that will never become READY on
  // their own: the control layer has declared them dead and only an operator
  // can retry or abandon them (Stratum_设计文档v13.md §10.1).
  //
  // The remedy is ForceRetryVersion (index side, revocable) or
  // ForceAbandonVersion (removes the version from the chain). Abandoning is also
  // what clears the verdict's leftovers on STORAGE nodes: a verdict travels the
  // Raft log and so reaches only members, while a deletion is broadcast to every
  // candidate replica.
  repeated FailedVersion failed_permanent_versions = 8;
  // gc_blocked_versions lists ACTIVE versions whose artifact carries more dead
  // weight than the ratio allows, but which this node cannot collect because too
  // few replicas would remain serving (§8.6(d)).
  //
  // It is an ALERTING signal, not a failure: the data is intact, the version is
  // queryable, and nothing was modified. What is wrong is that
  // IndexServingReplicaMin leaves no replica free to rotate — with a replica
  // count equal to the minimum, collection can never start and the artifact
  // keeps its dead weight forever. The remedy is configuration, which is exactly
  // why it has to be visible rather than silently endured.
  repeated GCBlockedVersion gc_blocked_versions = 9;
  // reclaim diagnoses the §7.5 reclaim watermark — "which recorded changes may this node
  // drop" — when it cannot be established at all.
  //
  // It exists because that failure is otherwise silent in the other direction: WAL
  // reclamation simply stops for the knowledge base, and nothing else reports it. The
  // state is not a fault — the watermark is deliberately conservative, and
  // a required replica that is merely away holds it still — but it is also not visible
  // anywhere else, and its remedy (dropping the node from storage.nodes) is a decision an
  // operator has to make deliberately.
  ReclaimDiagnostics reclaim = 10;
  // node_state is THIS node's own lifecycle phase, its own view of storage
  // redundancy, and what it is currently working on
  // (docs/storage-node-state-machine-plan.md §3).
  //
  // It is the one place to ask "what state is this node in". Before it, that
  // answer was computed on demand in six unrelated places and differed by
  // caller: the process phase was not represented at all, redundancy was
  // re-derived from a report aggregate per call, and "index build in progress"
  // was private to the index manager. The other fields of this response
  // describe conditions that need a human; this one describes the node.
  NodeState node_state = 11;
  // version_states lists this node's versions that are NOT at rest — being
  // built, or with a failed build. Deliberately not every version: data
  // present with no index is the designed state of a version nobody has asked
  // for (lazy builds), and a node holding thousands of READY versions has
  // nothing to report about each. What belongs here is the small, moving set.
  repeated VersionStateEntry version_states = 12;
}

// NodeState is the storage node's own lifecycle phase and local view
// (docs/storage-node-state-machine-plan.md §3).
message NodeState {
  // state is STARTING / RECONCILING / SERVING / STOPPING.
  string state = 1;
  // since is when the current phase was entered, RFC3339.
  string since = 2;
  // redundancy is UNKNOWN / HEALTHY / DEGRADED / UNAVAILABLE.
  //
  // UNKNOWN is not a problem state: it is this node saying it has no basis for
  // a verdict (it does not lead the control plane, or nothing has reported
  // yet). The write gate fails OPEN on exactly this input, so a reader must
  // not treat it as evidence of trouble.
  string redundancy = 3;
  // redundancy_detail explains a non-healthy redundancy verdict, and is empty
  // otherwise.
  string redundancy_detail = 4;
  // actions is what the node is doing right now — "reconciling indexes",
  // "building 3 index(es)", "catching up kb-1". FOR HUMANS: it is a projection
  // of the phase and the version states, and nothing may branch on it.
  repeated string actions = 5;
}

// VersionStateEntry is one version's local state on the node that answered
// (docs/storage-node-state-machine-plan.md §4).
message VersionStateEntry {
  string kb_id = 1;
  int64 version_id = 2;
  // state is ABSENT / DATA_PRESENT / BUILDING / READY / BUILD_FAILED.
  //
  // This is a LOCAL fact and is not IndexStatus or DataStatus: those are the
  // control layer's replicated metadata, identical on every node and copied
  // through snapshots. The same version is routinely READY on one replica,
  // BUILDING on the next and DATA_PRESENT on the third, which is healthy
  // rather than divergent. The control layer's FAILED_PERMANENT does not
  // appear here at all — that verdict is the retry budget's conclusion, and
  // this node knows only that its own build failed.
  string state = 3;
  // since is when the version entered state, RFC3339.
  string since = 4;
  // detail carries the cause for BUILD_FAILED, empty otherwise.
  string detail = 5;
}

// GCBlockedVersion is one version whose dead-weight collection is stuck behind
// the service-capacity check.
message GCBlockedVersion {
  string kb_id = 1;
  int64 version_id = 2;
  // dead_share is the estimated share of the artifact's vectors that the current
  // document set no longer justifies (§8.6(d) phase 1's estimate).
  double dead_share = 3;
  // others_serving / minimum_required are the two numbers the decision is made
  // from: how many OTHER replicas are serving the version, and how many must
  // remain. others_serving < minimum_required is the whole reason this entry
  // exists.
  int32 others_serving = 4;
  int32 minimum_required = 5;
  // blocked_since is when this node first found the collection blocked, Unix
  // seconds. Reported rather than thresholded here: how long is "too long" is a
  // deployment's call, and an operator looking at the age of a stuck version
  // knows better than a constant chosen in this repository.
  int64 blocked_since = 6;
}

// ReclaimDiagnostics answers "why is the §7.5 reclaim watermark not moving", which the
// bare absence of a watermark cannot: reclaiming simply stops, and the only other trace
// is a warning line in the node's log.
message ReclaimDiagnostics {
  // judgement_available=false means THIS NODE cannot answer (it is not the control
  // leader, or no replica topology/aggregate is wired). blocked is then empty because it
  // is UNKNOWN, not because nothing is blocked — the two fields have to be read together,
  // or a follower's answer reads as a clean bill of health.
  bool judgement_available = 1;
  repeated ReclaimBlockedKB blocked = 2;
}

// ReclaimBlockedKB is one knowledge base whose watermark cannot be established, with the
// required replicas that are keeping it that way.
message ReclaimBlockedKB {
  string kb_id = 1;
  repeated ReclaimBlocker blockers = 2;
}

// ReclaimBlocker is one required replica whose report keeps a knowledge base's watermark
// unavailable.
message ReclaimBlocker {
  int64 node_id = 1;
  // reason is one of three stable wire names:
  //   "never_reported"  — it has told the leader nothing at all;
  //   "no_cursor_for_kb" — it reports, but said nothing about this knowledge base; that
  //                        is not the same as reporting zero;
  //   "stale"           — its last report is older than the storage silence window, so its
  //                        cursor is no longer evidence of what it holds now.
  string reason = 2;
  // reached_version is its last reported cursor for the knowledge base; 0 wherever there
  // is no cursor to quote (never_reported / no_cursor_for_kb).
  int64 reached_version = 3;
  // last_report_age_ms is how long ago its last report arrived, in milliseconds, against
  // the answering node's own clock. Negative means it has never reported. An AGE rather
  // than a timestamp: the reader wants "how stale", and the two clocks are not guaranteed
  // to agree.
  int64 last_report_age_ms = 4;
}

// GetClusterStatusRequest is empty: the node reports its own view of the
// Raft cluster.
message GetClusterStatusRequest {}

// GetClusterStatusResponse is this node's view of Raft cluster
// connectivity. The routing layer uses node_id + leader_id to resolve the
// leader's gRPC address from its node list.
message GetClusterStatusResponse {
  int64 node_id = 1;        // this node's ID
  bool has_leader = 2;      // whether this node currently knows a leader
  int64 leader_id = 3;      // node ID this node believes is the leader
  int64 member_count = 4;   // configured cluster size
}

message RebuildIndexRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}
message RebuildIndexResponse {
  bool success = 1; // asynchronous; does not wait for the build to complete
}

message WarmupVersionRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}
message WarmupVersionResponse {
  bool success = 1; // asynchronous
}

// ListFailedVersionsRequest asks which versions are waiting for a human: those the
// control layer declared FAILED_PERMANENT on either side (§10.1, §10.1b). Nothing
// retries them automatically, so this list IS the work queue.
message ListFailedVersionsRequest {
  // Empty lists every knowledge base. The per-knowledge-base form is how an
  // operator arrives ("this one has a version stuck"); the global form is the
  // question they ask next ("is anything else stuck?"), and answering it here
  // spares the caller a fan-out over ListKnowledgeBases.
  string knowledge_base_id = 1;
}

message ListFailedVersionsResponse {
  // The same FailedVersion shape GetSystemStatus reports, so a console renders
  // both without a second decoder — and so the two can never disagree about what
  // a failed version looks like.
  repeated FailedVersion versions = 1;
}

// ForceRetryVersionRequest asks the control layer to put one side of a terminated
// version back into play.
message ForceRetryVersionRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}

message ForceRetryVersionResponse {
  bool success = 1;
  // side names the half that was retried, so a caller that asked for "retry" and
  // got success knows what it got.
  //
  // Only the INDEX side is retried by this RPC, and that is a property of the two
  // verdicts rather than a limitation of the interface: an index-side verdict is a
  // statement about a build, and a build can be revoked by rebuilding, while a
  // DATA-side verdict says the version's data will never arrive — there is nothing
  // to retry, and the honest answer is ForceAbandonVersion. Asking for a data-side
  // retry is refused with that reason instead of silently succeeding at nothing.
  FailureSide side = 2;
}

// ForceAbandonVersionRequest abandons a terminated version — the other answer to a
// verdict the operator does not intend to fight.
message ForceAbandonVersionRequest {
  string knowledge_base_id = 1;
  int64 version_id = 2;
}

message ForceAbandonVersionResponse {
  bool success = 1;
  // deleted_version_ids mirrors DeleteVersion's own field, because this is that
  // operation under SINGLE semantics: the version leaves the chain, and any child
  // is spliced onto its parent rather than removed with it.
  repeated int64 deleted_version_ids = 2;
}
