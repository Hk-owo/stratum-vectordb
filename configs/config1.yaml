# config1.yaml — Stratum single-node configuration
#
# 权威字段参考是 cmd/stratum 里 config 结构的 yaml tag:本文件只列真正被解析的键,
# 写在这里而不被解析的键会静默失效,所以宁可少写。
#
# 目录布局(docstore / chunkdoc / versiondoc / wal / index)由代码固定在 storage.data_dir
# 之下,不做配置项 —— 改它们没有任何效果。
#
# This file defines a minimal single-node deployment suitable for
# development and testing against a local vecstore process and a mock
# embed HTTP server.

node:
  node_id: 1
  grpc_addr: "0.0.0.0:7000"         # KnowledgeBaseService / QueryService / AdminService
  raft_addr: "0.0.0.0:8000"         # Raft internal communication
  metrics_addr: "0.0.0.0:9000"      # Prometheus /metrics
  # 服务站信任戳的时效（毫秒）。它约束的是重放：戳一旦在链路上被看到，超过这时长就
  # 不再被接受。窗口要覆盖同密钥进程之间的时钟偏差，所以是几十秒而不是 1 秒。
  # 0 = 用 authmeta.DefaultMarkTTL（30 秒）。
  station_mark_ttl_ms: 0

control_plane:
  # 判 FAILED_PERMANENT 之前容忍的失败次数（Stratum_设计文档v13.md §10.1）。
  # 0 = 用 plane.DefaultFailureBudget（5）。
  failure_budget: 0

raft:
  peers:
    - id: 1
      addr: "localhost:8000"
  # 控制层**有界删除日志**的条数上限；<= 0 用默认的 10000。存储节点靠它做增量对账：
  # 调大 ⇒ 节点可以落后更久才必须回退全量活链读；代价是每条都随 raft 快照往返。
  deleted_log_limit: 0
  # 单次 peer 间 Raft RPC（RequestVote / AppendEntries / 快照触发）的超时。
  # 这些是定时器驱动的后台调用，所以这个上限只决定"一个挂住的 peer 能把一轮复制拖
  # 多久"。0 = 用 kvraft 默认值（1 秒）。
  rpc_timeout_ms: 0
  # 一次 Propose* 等待自己的日志被 apply 的上限；超时后报告"结果未知"（可安全重试）。
  # 0 = 用 raft 默认值（60 秒）。调小让失去 quorum 的 leader 更早放手，但不会让本节点
  # 停止等待领导权变更。
  propose_apply_timeout_ms: 0

storage:
  data_dir: "/var/lib/stratum/node1"

vecstore:
  # 节点只连 vecstore 的 gRPC 端口;vecstore 进程自己的 --rocksdb_path / --health_addr
  # 由启动它的脚本给出,不在节点配置里。
  grpc_addr: "127.0.0.1:7100"
  # 节点到 vecstore 的 gRPC 连接保活参数（chunk 存储与索引管理共用一条配置）。
  # **只探测活动流**：vecstore 的 C++ 服务端会把无流 ping 当成 too_many_pings 用
  # GoAway 踢掉连接（压测时表现为 build RPC 挂起、版本永久 PENDING）。
  # 0 = 默认值（间隔 60 秒、应答窗口 3 秒）。
  keepalive_interval_ms: 0
  keepalive_timeout_ms: 0

embed:
  # embed 服务的地址；省略 = http://localhost:8080（与本文件的单节点假设一致）。
  # service_addr: "http://localhost:8080"
  # embed 服务的 HTTP 客户端超时；0 = 30 秒；负数 = 不做客户端级超时（交给 ctx）。
  timeout_ms: 0

write_coordinator:
  max_retries: 3
  retry_base_interval_ms: 100
  # 一次后台派发的**外层**预算：从版本提交到写入交给某个协调者。它必须**大于**
  # dispatcher 的单候选预算（下面那三件套），否则内层先过期、外层无从报告，调用方
  # 只看到"派发出去了但没发生"。0 = 5 分钟。
  dispatch_timeout_ms: 0
  # 一次后台派发的"认领"记录能解释多久之后的 miss（把"派发与 apply 抢跑"和"版本
  # 无人认领"区分开）。0 = 2 分钟。
  dispatch_claim_window_ms: 0
  # 记录"放弃"那次 Raft 往返的上限。0 = 30 秒。
  abandon_report_timeout_ms: 0
  # 一个版本里同时处理的文档数上限。0 = 8。
  max_concurrent_document_writes: 0

delete_coordinator:
  max_retries: 5
  retry_base_interval_ms: 500
  # 两个"收尾"扫描的周期：版本被标记 Deleting（那是已应答调用方的 Raft 命令）之后
  # 进程死掉，清理就没人做了——这两个扫描把它接着做完。一轮只读状态机里的 id，
  # 无 IO 无 RPC，所以周期可以短。0 = 各自默认 1 分钟。
  deleting_version_sweep_interval_ms: 0
  deleting_kb_sweep_interval_ms: 0

# 对账（reconcile）—— 把"元数据里已经删除、但本节点还留着字节"的残留版本清掉
# （docs/known-gaps.md §B/§C 那个窗口）。判据是控制层的当前状态：本节点持有的版本号
# 是否已分配、且不在存活集合里。
#
# 两个开关分开：启动那一趟和运行期那一趟是同一个不可逆动作，但回答的是不同的问题
# （"开机时躺着多少"对"运行中还在冒多少"），运维可能只想开其中一个。
reconcile:
  # 启动那一趟。扫描本身是只读的、默认就会跑，并在启动日志里报告发现了多少（让问题
  # 可见）；这个开关只决定要不要真的回收。
  #
  # 默认 true，与本文件里其他"不可逆"开关（gc_enabled、索引保留）不同：被动收到删除
  # 广播的存储节点**没有任何本地记录**（它不写 WAL 标记，只是被告知去丢数据），唯一
  # 能再次指出这些字节的就是这次对账——关着就等于让它们躺到运维偶然翻到启动日志为止。
  # 而"不可逆、判错会在每次重启重放"这层顾虑，在这里由判据本身兜住：它删的是控制层
  # 已经没有的版本，且 §B 的安全规则都在里面（读不到就跳过该 KB，而不是猜；"从未分配
  # 过"也不会被读成"已删除"）。
  deleted_versions: true
  # 运行期那一趟**主动**的全量。它只对"本节点持有的版本集合变化过"的轮次真的扫一遍，
  # 所以空闲节点零成本；而残留的主要来源恰恰只在运行期出现——一个 push 活过了本该删掉
  # 它的删除操作，不需要任何故障。默认 true 是同一个理由的加强版：只看启动的节点会把
  # 这类数据一直带到下一次重启。
  # 注意它**不**管"日志服务不了"时的回退（无水位 / 截断 / 纪元不符）：那是正确性所需，
  # 无论这里写什么都跑一次全量，否则只开增量的节点会永久停在 skipped(chain-disabled)。
  deleted_versions_periodic: true
  # **上一次完整活链对账**允许的最大年龄（秒）；<= 0 用默认的 86400（24 小时）。
  # 增量路径不得把它无限期推后：日志描述不了"晚到 push 留下的残留"，而那是这条兜底
  # 唯一能发现的东西。名字沿用旧语义（它过去就是这个间隔）。
  deleted_versions_interval_s: 0
  # 增量快路径：每个 tick 只读控制层的**有界删除日志**，而不是每个 KB 一次区间活链读。
  # 默认 true，且**独立于** deleted_versions_periodic：两条路成本不同，只想要便宜那条
  # 是完全合理的部署。日志服务不了的情形（截断 / 纪元不符 / 无水位）才会回退全量。
  deleted_versions_incremental: true
  # 增量 tick 的间隔秒数；<= 0 用默认的 60。
  deleted_versions_incremental_interval_s: 0
  # 单次增量读的页大小；<= 0 用默认的 512。控制层日志上限 10 000 条 ⇒ 最多 20 页。
  deleted_versions_log_page: 0
  # 一次扫描最多翻几页。更大的批量删除由后续 tick 翻完；这个上限保证一轮不会无限长。
  # 0 = 8 页。
  deletion_pages_per_sweep: 0
  # 两次**完整活链对账**之间的最小间隔（本节点有落地活动时才会触发）。没有它，
  # "这里有东西落地"会变成每个增量 tick 都做一次区间扫描——正是这套机制要省的开销。
  # 0 = 5 分钟。
  chain_reconcile_min_age_ms: 0
  # 本节点"被告知删除、本地清理失败"的重试周期。它不走网络（读本地墓碑表 + 本地
  # 前缀删除），所以比上面的对账快得多：这是那条"没人会再告诉我一次"的快路径。
  # 0 = 30 秒。
  deleted_version_retry_interval_ms: 0
  # 已完成的墓碑条目保留多久：覆盖最后一个窗口——回收完成不等于没有在途副本
  # （一个还在重试的 push、一次删除前就开始的 backfill）。0 = 1 小时。
  tombstone_grace_ms: 0

index_manager:
  lru_capacity: 16
  # 内存字节阈值。记账口径见 Stratum_设计文档v12.md 3.3：OFF(全精度)KB
  # 按 4×d×n 向量载荷记账；SQ/PQ 量化 KB 按 vecstore 报告的「图边+量化码」
  # 粗筛器口径记账（单条目显著变小）。启用量化后同样预算可驻留更多版本，
  # 阈值可按部署内存压力自行调整（调低 = 更早换出冷版本粗筛器）。
  memory_threshold_mb: 4096
  # 量化粗筛的候选数（Stratum_设计文档v12.md §2.2）。它是「量化召回 / 延迟」
  # 之间唯一的旋钮：候选集就是拿去与全精度向量 rerank 的那批，放大它覆盖更多
  # 真实近邻、代价是更多磁盘读。0 = 不发送该字段，由 vecstore 用自带默认
  # clamp(top_k × 8, 16, 4096)。
  candidate_n: 0
  load_wait_timeout_ms: 5000
  callback_max_retries: 3
  callback_retry_base_interval_ms: 200
  # §8.6a 冷版本免图分层。某个版本连续 cold_threshold_ms 没有被查询，它的
  # 索引就建成「免图」形态（量化码 + 暴力扫描，省掉 HNSW 图边的构建耗时与
  # 常驻内存）；检索语义不变（量化方式与 rerank 一致）。0 = 关闭该策略
  # （默认），行为与历史一致：每个版本都建完整 HNSW 图。
  #
  # 形态在**构建那一刻**按本节点自己的访问记录决定（internal/index/impl.go 的
  # coldShapeFor）；查询打到一个形态与流量不符的产物上时按 needsReshape 触发
  # 重建（回热方向用半个阈值，中间那段是迟滞）。**没有扫描周期可调**：后台定时
  # 评估器与 cold_sweep_interval_ms 都已删除（它建没人要的东西，且忽略 owner
  # 集——在 owner 之外的节点上构建产物，永远不会有查询到达）。形态变化后的产物
  # 与新建索引同路：需要它的副本按需 FetchIndexData 拉取。
  cold_threshold_ms: 0
  # §8.6(c) 的增量复用门槛与 §8.6(d) 的回收报告门槛。**2026-10 起两者分开**：
  # 复用门槛 append_max_dead_ratio 默认 0.2，回收报告门槛 gc_ratio_threshold
  # 默认 0.3。相等时（都曾是 0.2）§8.6(c) 恰好会在 §8.6(d) 开始关心的那一刻
  # 重建，于是 (d) 永远看不到候选 —— 这正是 docs/known-gaps.md §G 记的那件事，
  # 现在把报告门槛抬到复用门槛之上来解开它。0 = 用 IndexManager 默认值（0.3）。
  gc_ratio_threshold: 0
  # 磁盘保留策略的「访问保护」。retention 默认只按版本号保新
  # （gc.version_retention_count 个），于是一个还在被读的老版本（客户比对历史版本、
  # 客户端钉在旧版本上）会被当成死版本删掉，下次查询再重建一次——它从来都不冷。
  # 这里给「本节点最近查询过的版本」加一层保护：查询时间写在 <versionID>.index.used
  # 旁车里，所以进程重启后（启动那一遍删得最狠）依然有效。保护是**额外**保留，数量
  # 上限由 retention_protect_max 决定（默认取 version_retention_count），因此磁盘最多
  # 保留 2×version_retention_count 份索引。
  # 0 = 用默认（24h）；负数 = 关闭该保护（历史行为：只保新）。
  retention_protect_window_ms: 0
  retention_protect_max: 0
  # §8.6(c) 纯追加复用的"死向量"上限。版本 N 若只是版本 N-1 的纯追加（父产物
  # 还在本节点、形态一致），就以其产物为起点只追加新增 chunk；若本版本删了文档，
  # 被删文档的向量会以「墓碑」形式留在产物里（查询路径会把它们的结果滤掉，代价
  # 是内存与 top-K 候选名额）。墓碑占比超过该比例时改用全量重建（顺带清掉墓碑）。
  # 0 = 用 IndexManager 默认值（0.2）；1.0 = 从不因墓碑而重建。
  append_max_dead_ratio: 0
  # §8.6(d) 已封印索引的墓碑回收。扫面（gc_scan）默认就在跑：它只读本地产物与
  # 当前文档集，把墓碑占比超阈值的「活跃且长期没有后继版本」的版本记进日志
  # （以及 GetSystemStatus 的 gc_blocked_versions）。gc_enabled 控制的才是「收集」
  # ——重写一个正在对外服务的产物。
  #
  # **2026-10 起默认开启**：收集有两道闸门（serving_replica_min：除我之外还有几个
  # 副本在服务该版本；gc_ratio_threshold：墓碑占比够不够高），且只在滚动回收里短暂
  # 退出服务池。要回到「只报告不收集」（2026-10 之前的行为）就写 false。
  gc_enabled: true
  # 收集前先问控制层「除我之外还有几个副本在服务这个版本」，不足该数就放弃：
  # 滚动回收的前提是「我暂时下线之后仍有人能服务」。0 = 用 IndexManager 默认
  # 值（**1**）。它独立于 DurabilityPolicy.Replicas —— 那个保持久性，这个保读
  # 服务能力。
  #
  # 默认曾为 2，2026-10 改为 1：索引是**按需构建**的（§8.6(b)），叠加 owner 分片
  # （§8.5），一个没被路由到的副本不会持有该版本的索引 —— 于是「除我之外还有 2 个
  # 在服务」实际等于要求**三个副本都持有**，收集永远启不动（实测 others_serving=1
  # < 2，见 docs/stress-test-report.md §E）。闸门的本意是「我下线后仍有人答得上」，
  # 1 就满足它。要在滚动时留更多余量、或用更大的副本数，就调大这个值。
  serving_replica_min: 0
  # 带图形态没有「原地删向量」这条路（faiss 的 HNSW 不支持 RemoveIds），只能整图
  # 重建：从当前存活文档集现建一份新图（顺带清掉全部墓碑）。代价是整张图，所以
  # 阈值比 append_max_dead_ratio 高得多：0 = 用 IndexManager 默认值（0.5）。
  graph_rebuild_ratio: 0
  # §8.6(d) 扫描周期。0 = 用 IndexManager 默认值（10 分钟）；负数 = 关闭扫描
  # （连收集一起没了——候选只由扫描产生）。
  gc_sweep_interval_ms: 0
  # 同时进行的索引构建数上限。0 = 用 IndexManager 默认值（CPU 核数）。
  #
  # 它约束的是"一次构建风暴能造成多大争抢"：此前每次触发就是新开一个 goroutine，
  # 没有任何上限，于是重启后对整段历史的重建会把一个新写入饿死（实测 601 秒等不到
  # READY）。上限之外，IndexManager 的构建池还让实时写入的构建**插队**于 reconcile
  # 的批量补建之前——即便积压几百个，也不会排在它们后面等。
  build_concurrency: 0
  # 索引产物**跨节点传输**的并发上限。2026-10 起传输只剩拉取方向
  # （FetchIndexData），闸门因此落在**提供传输的源节点侧**：限"本节点同时服务
  # 几路取产物"，超过上限的传输排队而不是被拒绝。它约束的是"同一版本被 N−1 个
  # 副本同时索要"这类突发对网络、源节点磁盘 IO 与内存的冲击——每次传输都要把
  # 整份产物读进内存再流式发出。0 = 不限。
  #
  # 旧配置项 index_manager.push_concurrency（推送侧的分发上限）已随推送整体移除；
  # 写在配置里也不会生效。
  fetch_concurrency: 0
  # §8.8 构建残留的自超时回收（后台，默认开）。构建在候选节点上失败或被放弃
  # （版本最终在别处 READY，从未进入 FAILED_PERMANENT）时，本机会留下两类没人
  # 回收的残留：① Save 在「先 rename .index、后 rename .index.ids」之间死掉 →
  # 有 .index 无 .index.ids；② Save 中途死掉留下的 .index.tmp / .index.ids.tmp。
  # 后台扫描按文件 mtime 超过该窗口即删除两者（已封印的一对永不触碰——那是磁盘
  # 保留策略的职责）。0 = 默认 30 分钟；负数 = 关闭该扫描。
  build_abandon_timeout_ms: 0
  # 上面那个扫描的周期；0 = 5 分钟。
  build_abandon_sweep_interval_ms: 0
  # 未建索引的版本小于该文档数时，查询直接暴力扫描而不建索引（§8.6b）。
  # 0 = DefaultBruteForceMaxChunks（50 000）。
  brute_force_max_chunks: 0
  # 构建内的重试循环：数据同步还在落地时，构建要么等它、要么失败后由控制层换候选
  # 重试。调大超时能让构建赢过一次慢拉取。0 = 5 分钟 / 2 秒。
  build_retry_timeout_ms: 0
  build_retry_interval_ms: 0
  # 版本的访问时间写进 <versionID>.index.used 旁车的节流间隔——那是保留保护
  # 唯一的证据来源。0 = 1 分钟。
  access_persist_interval_ms: 0

# 存储平面（data_plane）—— 面向 peer 的各种预算。每一项都是 0 = 组件自己的默认值，
# 也就是这些键出现之前每个部署都在用的那个数。
#
# 这些数共同决定"一个节点落后多久才算异常"与"一次拉取/推送/确认能占多久"的平衡，
# 属于部署判断（磁盘、网络、批量大小），所以从常量提到了配置里。
data_plane:
  # EnsureIndex 拉取循环：多久**没有进展**就放弃（进度 = 完成一次传输，不是时钟）。
  # 0 = 30 秒。
  pull_idle_timeout_ms: 0
  # 拉取循环的绝对上限，防止"一直有一点点进展"的循环永不结束。0 = 10 分钟。
  pull_max_duration_ms: 0
  # 每个知识库同时在途的写入数上限（§7.7）：一个卡住的版本不能让后面排成无界队列。
  # 0 = 8。
  max_in_flight_writes: 0
  # 游标记录的一次写入上限（本地 append + fsync）。0 = 5 秒。
  cursor_write_timeout_ms: 0
  # 一批游标写失败后多久重试；只作用于失败路径。0 = 1 秒。
  cursor_retry_delay_ms: 0
  # §7.3 确认广播：单次尝试、尝试间隔、整场广播的预算。0 = 2 秒 / 500 毫秒 / 60 秒。
  confirm_attempt_timeout_ms: 0
  confirm_retry_backoff_ms: 0
  confirm_budget_ms: 0
  # 扇出时单个副本的推送预算：一个下限 + 每文档增量——因为 peer 要做的事随批量增长
  # （实测 ~14.6 ms/文档）。0 = 3 秒 + 20 毫秒/文档。
  replica_push_timeout_ms: 0
  push_timeout_per_doc_ms: 0
  # 单个 peer 的游标查询上限（启动期与回收水位判定用）。0 = 2 秒。
  peer_cursor_timeout_ms: 0
  # §7.3 接管：等协调者公告的时长、一次 quorum 检查的上限、一次监视最多几次检查、
  # 以及检查之间的退避上限。0 = 200 毫秒 / 2 秒 / 8 次 / 5 秒。
  takeover_timeout_ms: 0
  takeover_check_timeout_ms: 0
  takeover_max_attempts: 0
  takeover_max_retry_delay_ms: 0
  # 控制层判定终态版本的本地回收队列：周期与耐心（次数）。
  # 0 = 1 分钟 / 10 次。
  terminal_reclaim_interval_ms: 0
  terminal_reclaim_attempts: 0

# 节点之间的控制流量（sync）。
sync:
  # 向控制 leader 报活的心跳周期（响应里带回链尾，是本节点发现自己落后的信号）。
  # 心跳是软状态，丢一次没关系。0 = 5 秒。
  heartbeat_interval_ms: 0
  # 一次拉取的**连接握手**上限，只限握手——传输本身大不等于失败。0 = 15 秒。
  pull_dial_timeout_ms: 0
  # holders 缓存（"哪个 peer 能供这个 KB"）的 TTL 与按 KB 的条目上限。追赶中的节点
  # 每隔几秒刷新一次，缓存骑得住一个慢 peer。0 = 15 秒 / 512。
  holders_cache_ttl_ms: 0
  holders_cache_limit: 0

# 写派发的单候选预算（§7.13.2）：下限 + 每文档增量 + 二者之和的上限。
# 这里必须小于 write_coordinator.dispatch_timeout_ms，否则内层先过期、外层无从报告。
# 0 = 15 秒 / 50 毫秒 / 10 分钟。
dispatcher:
  candidate_timeout_ms: 0
  candidate_timeout_per_doc_ms: 0
  max_candidate_timeout_ms: 0

# §7.13.5 的 peer 降级启发式：连续失败几次开始降级、降级持续多久（期间排到最后，
# 但不会被剔除）。0 = 3 次 / 30 秒。
health:
  demote_after: 0
  demote_for_ms: 0

# 进程自己的启动/收尾节奏。
recovery:
  # WAL 崩溃回放：每条记录在进程内重试几次、指数退避的基数（毫秒）。
  # 重试窗口之外仍然失败的记录被跳过并计数，留在 WAL 里等下次重启——启动绝不因此中止。
  # 0 = 3 次 / 100 毫秒。
  crash_replay_max_attempts: 0
  crash_replay_retry_base_ms: 0
  # 启动后发布 epoch 载荷的重试：间隔与总窗口。"本节点已 serving"不代表"peer 也
  # serving"，所以那些还没有 quorum 的 KB 要重试；窗口之外仍不齐就是另一个问题了。
  # 0 = 3 秒 / 60 秒。
  epoch_report_retry_interval_ms: 0
  epoch_report_retry_window_ms: 0
  # 收尾时等待 metrics 端点停止的上限。0 = 2 秒。
  shutdown_timeout_ms: 0

bloom_filter:
  expected_items: 1000000
  false_positive_rate: 0.01

# 切块的默认值不在这里:CDC 的 256 B / 1536 B / 512 B 与窗口模式的 512 / 64 都是
# internal/types 的常量,知识库创建时由请求覆盖。

gc:
  version_retention_count: 50
  # 孤儿 chunk 回收的主触发是"删除版本"（DeleteVersion 流程的清理里就地判定），
  # 这里的周期 sweep 只是兜底：捡那些没有任何删除事件能再命名的残留（例如写路径
  # 在向量写与映射写之间崩溃留下的孤儿映射）。所以默认给到 1 小时——每轮它是
  # 每 KB 一次整链读 + 一次全量 chunk 映射扫描。
  sweep_interval_s: 3600
  # WAL 压缩周期：丢掉每个副本都已持有的变更记录（§7.5）。压缩要重写文件，而丢掉
  # 的记录只是省空间，没人等它，所以可以慢。0 = 5 分钟。
  wal_reclaim_interval_s: 0

# 主动落后追赶（docs/active-lag-detection-design.md）。节点每 5 秒向控制 leader 发心跳，
# 响应里的 chain_generation 变化时拉取每 KB 的「链尾」（已提交的最新版本）；本节点若发现
# 自己落后，就在后台追一次——复用查询路径（EnsureIndex），所以既有的闸门照旧生效，
# 这里只决定「什么时候开始」——没有开关：落后副本自己追上来是常态，而不是「等谁撞上」。
# 该调的是节奏（下面两项），不是要不要追。
lag_catchup:
  # 落后多少版本才算落后。1 = 差一个就追（正常写入竞态可能触发一次，代价只是白追一趟）。
  min_lag_versions: 1
  # 收到信号后随机延迟的上界（毫秒），把「同时发现」摊平成一个窗口。
  # 单独靠它不构成上界——落后的 KB 数量可能远超预期，所以还有下面那个并发上限。
  jitter_ms: 0
  # 同时最多几个 KB 在追赶。0 = 用默认值（2）。
  max_concurrent_kbs: 0
  # 一次追赶的上限。大 KB 合法地可能更久；估错了的代价只是"下一次信号再试一次"，而不是
  # 版本卡住。0 = 5 分钟。
  timeout_ms: 0
  # 追赶进行中，多久重新问一次 peer"谁能供这个 KB"（答案的 TTL 是它的三倍）。
  # 0 = 5 秒。
  holders_refresh_interval_ms: 0

logging:
  level: "info"
