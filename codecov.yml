# Codecov 配置 —— 对应 .github/workflows/ci.yml 的「上传覆盖率到 Codecov」步骤。
#
# 判据只针对**手写代码**。被 ignore 的两处不是"没测"，而是"Go 的 coverage.out
# 里本来就不该有"：
#
#   api/proto/**  protoc 生成的 *.pb.go。Go 测试不会去调用生成的消息类型与
#                 Get*/Reset/ProtoReflect，所以这 1300+ 行在任何提交上都是 0%；
#                 计入 patch 后，每次改 .proto 重新生成，都会凭空多出上百行
#                 "未覆盖的新代码"，即使对应的服务端逻辑（C++ 侧 + gRPC 客户端）
#                 有完整测试。这个项目的 C++ vecstore 另有 ctest 覆盖
#                 （.github/workflows/vecstore-cpp.yml）。
#
#   web/**        前端的 TypeScript/TSX 由 vitest 覆盖，走的是前端自己的覆盖率
#                 报告（见 web/ 的测试脚本），从来不会出现在 Go 的 coverage.out
#                 里。不 ignore 的话，Codecov 只会看到"这些文件完全没有数据"。
#
# 忽略之后，patch 覆盖率回答的才是它该回答的问题：这次改动里手写的那部分有没有
# 被测试碰到。project 也一并忽略，否则整体数字只是把生成代码按 0% 摊进分母。

ignore:
  - "api/proto/**"
  - "web/**"
  # *_test.go 永远不在 coverage.out 里（Go 只记录被测包的源码），所以"只改测试"的提交
  # 会被算成"新增 0% 覆盖"。实测：e7e6123 只改了 integration/e2e_test.go（修的却是一个
  # 真问题），codecov/patch 报 0.00% of diff hit (target 70.36%)。
  - "**/*_test.go"
  # integration 包没有非测试源文件，它的 profile 是 [no statements]：该目录下任何改动
  # 都没有覆盖数据可言，与上一条同一个理由。
  - "integration/**"

coverage:
  status:
    project:
      default:
        # 不低于上一次上传，容忍 1% 抖动（并发/计时相关用例的覆盖率会小幅浮动）。
        target: auto
        threshold: 1%
        informational: false
    patch:
      # 跟随项目覆盖率（ignore 之后的口径），不给"本提交新增的手写代码"留低于
      # 项目均值的口子。
      default:
        target: auto
        threshold: 0%
        informational: false
        # 把"不产生覆盖数据"的路径从 patch 门禁里排掉。
        #
        # 注意这两条必须写在这里，而不只是写在 ignore 里：ignore 是"解析上传报告时排除
        # 路径"，而 Go 的 coverage.out 里**本来就没有** *_test.go —— 报告里没有的东西，
        # ignore 排不掉，Codecov 仍会按 git diff 把它们算成"新增 0% 覆盖"。实测：
        # e7e6123 只改了 integration/e2e_test.go，codecov/patch 报 0.00% of diff hit
        # (target 70.36%)，而它修的却是一个真问题；2d7e835 改了源码 + 测试则是 91.80%。
        paths:
          - "!**/*_test.go"
          - "!integration/**"

comment:
  layout: "reach, diff, files"
  behavior: default
